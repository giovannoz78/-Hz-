<html lang="es">

  <!-- lo reemplazable vive afuera: textos, paleta y escenas en hz.config.js; marcos y formas en hz-datos.js (lo genera preparar.html) -->
  <script src="./hz.config.js"></script>
  <script src="./hz-datos.js"></script>
  <script>
  window.HZ=window.HZ||{}; window.HZ_DATOS=window.HZ_DATOS||{}; ['formas','marcos','miniaturas'].forEach(k=>{ if(!HZ_DATOS[k]) HZ_DATOS[k]={}; });
  // PALETA: todos los colores del motor pasan por HZC(). Los tonos dorados (matiz 12°-62°) se llevan al matiz de HZ.paleta;
  // el resto (cian del agua, blancos, negros) queda igual. matiz 40 + saturacion 1 = el oro original.
  window.HZC=function(c){
    const P=window.HZ.paleta||{}; if(P.modo!=='bn' && P.matiz==null) return c;
    if(typeof c==='string' && c.indexOf(',')>=0) return c.split(',').map(x=>HZC(x.trim())).join(',');
    const num=typeof c==='number', hex=num?('#'+c.toString(16).padStart(6,'0')):String(c);
    const m=/^#([0-9a-f]{6})$/i.exec(hex); if(!m) return c;
    let r=parseInt(m[1].slice(0,2),16)/255,g=parseInt(m[1].slice(2,4),16)/255,b=parseInt(m[1].slice(4,6),16)/255;
    if(P.modo==='bn'){                                                       // blanco y negro: cada color pasa a su gris de igual luminancia
      const y=Math.round(Math.min(1,Math.pow(0.2126*r+0.7152*g+0.0722*b,1/(P.contraste||1)))*255), o=(y<<16)|(y<<8)|y;
      return num?o:'#'+o.toString(16).padStart(6,'0'); }
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2; let h=0,sa=0;
    if(mx!==mn){ const d=mx-mn; sa=l>0.5?d/(2-mx-mn):d/(mx+mn);
      h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); h*=60; }
    if(sa<0.08 || h<12 || h>62) return c;
    h=((P.matiz+(h-40))%360+360)%360; sa=Math.min(1,sa*(P.saturacion==null?1:P.saturacion));
    const q=l<0.5?l*(1+sa):l+sa-l*sa, p=2*l-q, f=t=>{ t=(t%1+1)%1; return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p; };
    const to=v=>Math.round(Math.min(1,Math.max(0,v))*255);
    const out=(to(f(h/360+1/3))<<16)|(to(f(h/360))<<8)|to(f(h/360-1/3));
    return num?out:'#'+out.toString(16).padStart(6,'0');
  };
  // BLANCO Y NEGRO garantizado: también las texturas de los GLB, los colores de vértice y los tonos fijos de los shaders
  (function(){ const P=window.HZ.paleta||{}; if(P.modo!=='bn') return;
    const st=document.createElement('style');
    st.textContent='canvas.a-canvas{filter:grayscale(1)'+(P.contraste&&P.contraste!==1?' contrast('+P.contraste+')':'')+'}'+(P.camara!==false?'video{filter:grayscale(1)}':'');
    document.head.appendChild(st); })();
  // IMÁGENES GENERATIVAS: 'gen:interferencia' (dos fuentes de onda), 'gen:anillos' (anillos concéntricos que se quiebran), 'gen:moire' (dos tramas que se cruzan)
  window.hzGenerativa=function(spec){
    const tipo=String(spec).replace(/^gen:/,'')||'interferencia', S=512, cv=document.createElement('canvas'); cv.width=cv.height=S;
    const x=cv.getContext('2d'), im=x.createImageData(S,S), d=im.data;
    for(let j=0;j<S;j++) for(let i=0;i<S;i++){
      const u=(i+0.5)/S*2-1, v=(j+0.5)/S*2-1, r=Math.hypot(u,v); let w=0;
      if(tipo==='anillos'){ const a=Math.atan2(v,u); w=Math.cos(r*58+Math.sin(a*3)*1.6*r+Math.sin(a*7)*0.5); }
      else if(tipo==='moire'){ w=Math.cos(Math.hypot(u-0.12,v)*90)*Math.cos(Math.hypot(u+0.12,v+0.05)*90); }
      else { w=Math.cos(Math.hypot(u-0.28,v)*48)+Math.cos(Math.hypot(u+0.28,v)*48); w*=0.5; }
      const line=Math.pow(Math.max(0,w),6);                                   // crestas finas en blanco
      const edge=1-Math.min(1,Math.max(0,(r-0.62)/0.34)); const a=line*edge*edge;
      const k=(j*S+i)*4; d[k]=d[k+1]=d[k+2]=255; d[k+3]=Math.round(Math.min(1,a*1.4)*255); }
    x.putImageData(im,0,0); return cv.toDataURL('image/png');
  };
  window.hzSrc=function(src){ return /^gen:/.test(src||'')?hzGenerativa(src):src; };
  // FORMAS: nube de puntos de un modelo. Si preparar.html la dejó en hz-datos.js arranca al instante;
  // si no, se muestrea la superficie del GLB cuando termina de bajar (la secuencia espera al modelo).
  window.hzClave=function(src){
    if(src&&src[0]==='#'){ const a=document.querySelector(src); src=a?a.getAttribute('src'):src; }
    return decodeURIComponent(String(src||'').split('?')[0].split('/').pop());
  };
  window.hzDecodificar=function(B,n){
    const raw=atob(B.b64), u8=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) u8[i]=raw.charCodeAt(i);
    const q=new Int16Array(u8.buffer), N=Math.min(n||B.n,B.n), out=new Float32Array(N*3);
    for(let i=0;i<N*3;i++) out[i]=q[i]/32767*B.s; return out;
  };
  // muestreo por área sobre todas las mallas, en el espacio del a-gltf-model (igual que las formas precalculadas)
  window.hzMuestrear=function(root,stop,n,THREE){
    const T=THREE||AFRAME.THREE, tris=[], acc=[]; let tot=0;
    const a=new T.Vector3(),b=new T.Vector3(),c=new T.Vector3(),ab=new T.Vector3(),ac=new T.Vector3();
    root.traverse(o=>{
      if(!o.isMesh||!o.geometry||!o.geometry.attributes.position) return;
      const M=new T.Matrix4(); for(let k=o;k&&k!==stop;k=k.parent){ k.updateMatrix(); M.premultiply(k.matrix); }
      const pa=o.geometry.attributes.position, ix=o.geometry.index, cnt=ix?ix.count:pa.count;
      for(let t=0;t+2<cnt;t+=3){
        const i0=ix?ix.getX(t):t,i1=ix?ix.getX(t+1):t+1,i2=ix?ix.getX(t+2):t+2;
        a.fromBufferAttribute(pa,i0).applyMatrix4(M); b.fromBufferAttribute(pa,i1).applyMatrix4(M); c.fromBufferAttribute(pa,i2).applyMatrix4(M);
        const ar=ab.subVectors(b,a).cross(ac.subVectors(c,a)).length()*0.5; if(!(ar>0)) continue;
        tot+=ar; acc.push(tot); tris.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z);
      }
    });
    const out=new Float32Array(n*3); if(!acc.length) return out;
    for(let k=0;k<n;k++){
      const r=Math.random()*tot; let lo=0,hi=acc.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(acc[m]<r) lo=m+1; else hi=m; }
      let u=Math.random(),v=Math.random(); if(u+v>1){ u=1-u; v=1-v; } const j=lo*9;
      for(let e=0;e<3;e++) out[k*3+e]=tris[j+e]+(tris[j+3+e]-tris[j+e])*u+(tris[j+6+e]-tris[j+e])*v;
    }
    return out;
  };
  window.hzForma=function(modelEl,n,cb){
    const F=HZ_DATOS.formas[hzClave(modelEl.getAttribute('src'))];
    if(F){ cb(hzDecodificar(F,n)); return; }
    const go=()=>{ const root=modelEl.getObject3D('mesh'); if(root) cb(hzMuestrear(root,modelEl.object3D,n)); };
    if(modelEl.getObject3D('mesh')) go(); else modelEl.addEventListener('model-loaded',go,{once:true});
  };
  // busca una malla por nombre (el nombre puede estar en la malla o en cualquier nodo padre); si no aparece, usa la malla más grande
  window.hzMalla=function(root,name){
    const norm=v=>(v||'').toLowerCase().replace(/[^a-z0-9]/g,''); let hit=null, big=null, bn=-1;
    root.traverse(o=>{ if(!o.isMesh) return;
      const vc=o.geometry.attributes.position.count; if(vc>bn){ bn=vc; big=o; }
      if(hit||!name) return; let k=o; while(k){ if(norm(k.name)===norm(name)){ hit=o; break; } k=k.parent; } });
    return hit||big;
  };
  </script>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- cámara en alta definición: MindAR no pide resolución y el teléfono entrega 640x480, que estirado a pantalla completa se ve pixelado -->
  <script>
  (function(){
    const md=navigator.mediaDevices; if(!md||!md.getUserMedia) return;
    const orig=md.getUserMedia.bind(md);
    md.getUserMedia=function(c){
      try{ if(c&&c.video&&typeof c.video==='object'&&c.video.width===undefined){
        c=Object.assign({},c,{video:Object.assign({width:{ideal:1280},height:{ideal:720}},c.video)}); } }catch(e){}
      return orig(c).catch(err=>{ if(c&&c.video&&c.video.width){ const v=Object.assign({},c.video); delete v.width; delete v.height; return orig(Object.assign({},c,{video:v})); } throw err; });
    };
  })();
  </script>

  <!-- RIPPLE (onda de expansión) -->
  <script>
  AFRAME.registerComponent('ripple-surface',{
    schema:{width:{default:2.4},height:{default:2.4},speed:{default:0.14},damp:{default:1.0},lineWidth:{default:36.0},lineStrength:{default:2.7}},
    init(){
      const T=AFRAME.THREE, d=this.data, MAX=12;
      this.MAX=MAX; this._head=0;
      const geo=new T.PlaneGeometry(d.width,d.height,1,1);
      this.uniforms={
        iTime:{value:0}, count:{value:0},
        centers:{value:new Array(MAX*2).fill(0)},
        startT:{value:new Array(MAX).fill(-999)},
        speed:{value:d.speed}, damp:{value:d.damp},
        lw:{value:d.lineWidth}, ls:{value:d.lineStrength}
      };
      const vert=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `;
      const frag=`precision highp float; varying vec2 vUv; uniform float iTime; uniform int count; uniform float centers[24]; uniform float startT[12]; uniform float speed,damp,lw,ls;
      float shellN(float w,float width){ return exp(-abs(w)/width);}
      void main(){
        float ring=0.0;
        for(int i=0;i<12;i++){
          if(i>=count) break;
          vec2 c=vec2(centers[2*i], centers[2*i+1]);
          float dt=max(0.0, iTime - startT[i]);
          float r=distance(vUv,c);
          float w1=r - speed*dt;
          float s1=shellN(w1,0.012);
          float life=exp(-damp*dt*0.85);
          ring=max(ring, life*s1);
        }
        vec3 col = vec3(7.0/255.0, 163.0/255.0, 184.0/255.0) * (ls*ring); // #07a3b8

        gl_FragColor=vec4(col,ring);
      }`;
      const mat=new T.ShaderMaterial({uniforms:this.uniforms,vertexShader:vert,fragmentShader:frag,transparent:true,depthTest:false,depthWrite:false,side:T.DoubleSide,blending:T.AdditiveBlending});
      this.mesh=new T.Mesh(geo,mat); this.mesh.renderOrder=999; this.el.object3D.add(this.mesh);
      this.clock=new T.Clock();
    },
    reset(){const u=this.uniforms; u.iTime.value=0; u.count.value=0; u.centers.value.fill(0); u.startT.value.fill(-999); this._head=0;},
    addDrop(nx,ny){
      const u=this.uniforms,MAX=this.MAX;
      const i=this._head%MAX; this._head++;
      u.centers.value[i*2]=nx; u.centers.value[i*2+1]=ny;
      u.startT.value[i]=u.iTime.value;
      u.count.value=Math.min(u.count.value+1,MAX);
    },
    tick(){this.uniforms.iTime.value+=this.clock.getDelta();}
  });
  </script>

  <!-- Tilt-drops (múltiples gotas con inclinación) -->
  <script>
  AFRAME.registerComponent('tilt-drops',{
    schema:{minInterval:{default:800},maxRate:{default:90},sens:{default:1.2},thresh:{default:4},jitterBase:{default:0.08},jitterMax:{default:0.28},burstTilt:{default:10},burstSize:{default:6},maxPerFrame:{default:8}},
    init(){
      this.beta=0; this.gamma=0; this.last=0; this.prevBeta=0; this.prevGamma=0;
      const ask=async()=>{
        try{
          if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
            const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted')return;
          }
          window.addEventListener('deviceorientation',(e)=>{if(e.beta==null||e.gamma==null)return; this.prevBeta=this.beta; this.prevGamma=this.gamma; this.beta=e.beta; this.gamma=e.gamma;},{passive:true});
        }catch(e){}
      };
      window.addEventListener('pointerdown',ask,{once:true});
      ask();
    },
    _c(v){return Math.min(1,Math.max(0,v));},
    _rnd(){return Math.random()*2-1;},
    tick(){
      const now=performance.now();
      const tilt=Math.hypot(this.beta,this.gamma)*this.data.sens;
      const k=THREE.MathUtils.smoothstep(tilt,this.data.thresh,60);
      const interval=THREE.MathUtils.clamp(this.data.minInterval-(this.data.minInterval-this.data.maxRate)*k,this.data.maxRate,this.data.minInterval);
      let n=Math.floor(k*4);
      const jerk=Math.abs(this.beta-this.prevBeta)+Math.abs(this.gamma-this.prevGamma);
      if(tilt>this.data.burstTilt||jerk>8)n+=this.data.burstSize;
      if(now-this.last>interval*0.6)n=Math.max(n,1);
      n=Math.min(n,this.data.maxPerFrame);
      if(n>0){
        const ripple=this.el.components['ripple-surface'];
        if(ripple){
          let cx=this._c((this.gamma/60)*0.4+0.5);
          let cy=this._c(((-this.beta)/90)*0.4+0.5);
          const r=this.data.jitterBase+this.data.jitterMax*k;
          for(let i=0;i<n;i++){
            const a=Math.random()*Math.PI*2, rr=r*Math.sqrt(Math.random());
            const nx=this._c(cx+Math.cos(a)*rr+this._rnd()*0.02);
            const ny=this._c(cy+Math.sin(a)*rr+this._rnd()*0.02);
            ripple.addDrop(nx,ny);
          }
          this.last=now;
        }
      }
    }
  });
  </script>

  <!-- Lluvia -->
  <script>
  AFRAME.registerComponent('lluvia',{
    schema:{count:{default:3000},area:{default:3},yTop:{default:3},yBot:{default:-1.5},sizePx:{default:6},speed:{default:0.035},trail:{default:false},trailEvery:{default:120},trailLife:{default:700},trailOpacity:{default:0.35},trailDrift:{default:-0.25},trailMax:{default:4}},
    init(){
      const T=AFRAME.THREE,d=this.data,s=64,c=document.createElement('canvas');c.width=c.height=s;
      const x=c.getContext('2d'),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
      g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.5,'rgba(255,255,255,0.6)');g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g; x.fillRect(0,0,s,s); const tex=new T.CanvasTexture(c); tex.needsUpdate=true;
      const N=d.count,A=d.area,YT=d.yTop,YB=d.yBot; this.geo=new T.BufferGeometry();
      this.pos=new Float32Array(N*3); this.vy=new Float32Array(N); this.dx=new Float32Array(N); this.dz=new Float32Array(N);
      for(let i=0;i<N;i++){this.pos[3*i]=(Math.random()-0.5)*A*2; this.pos[3*i+1]=Math.random()*(YT-YB)+YB; this.pos[3*i+2]=(Math.random()-0.5)*A*2;
        this.vy[i]=d.speed*(0.7+Math.random()*0.6); this.dx[i]=(Math.random()-0.5)*0.0025; this.dz[i]=(Math.random()-0.5)*0.0025;}
      this.geo.setAttribute('position',new T.BufferAttribute(this.pos,3));
      const mat=new T.PointsMaterial({map:tex,size:d.sizePx,sizeAttenuation:false,transparent:true,opacity:0.95,alphaTest:0.01,depthTest:false,depthWrite:false});
      this.points=new T.Points(this.geo,mat); this.points.frustumCulled=false; this.el.object3D.add(this.points);
      this._ghosts=[]; this._acc=0; this._clock=new T.Clock(); this._tex=tex;
    },
    _spawnGhost(){
      const T=AFRAME.THREE,d=this.data;
      if(this._ghosts.length>=d.trailMax){const old=this._ghosts.shift(); this.el.object3D.remove(old.obj); old.obj.geometry.dispose(); old.obj.material.dispose();}
      const geoG=new T.BufferGeometry(); geoG.setAttribute('position',new T.BufferAttribute(this.pos.slice(0),3));
      const matG=new T.PointsMaterial({map:this._tex,size:this.data.sizePx,sizeAttenuation:false,transparent:true,opacity:d.trailOpacity,depthTest:false,depthWrite:false,blending:T.AdditiveBlending});
      const ghost=new T.Points(geoG,matG); ghost.renderOrder=997; this.el.object3D.add(ghost); this._ghosts.push({obj:ghost,t:0});
    },
    tick(){
      const d=this.data,A=d.area,YT=d.yTop,YB=d.yBot,p=this.pos,N=p.length/3;
      for(let i=0;i<N;i++){p[3*i]+=this.dx[i]; p[3*i+2]+=this.dz[i]; p[3*i+1]-=this.vy[i]; if(p[3*i+1]<YB){p[3*i+1]=YT+Math.random()*0.2; p[3*i]=(Math.random()-0.5)*A*2; p[3*i+2]=(Math.random()-0.5)*A*2;}}
      this.geo.attributes.position.needsUpdate=true;
      const dt=this._clock.getDelta(); if(d.trail){this._acc+=dt*1000; if(this._acc>=d.trailEvery){this._acc=0; this._spawnGhost();}
        for(let i=this._ghosts.length-1;i>=0;i--){const g=this._ghosts[i]; g.t+=dt*1000; const k=Math.min(1,g.t/d.trailLife);
          g.obj.material.opacity=d.trailOpacity*(1-k); g.obj.position.y+=d.trailDrift*dt; if(k>=1){this.el.object3D.remove(g.obj); g.obj.geometry.dispose(); g.obj.material.dispose(); this._ghosts.splice(i,1);}}}
    }
  });
  </script>

  <!-- Niebla -->
  <script>
  AFRAME.registerComponent('niebla',{schema:{count:{default:1800},area:{default:3.4},yTop:{default:2.2},yBot:{default:-1.6},sizePx:{default:28},speed:{default:0.006},opacity:{default:0.28}},init(){const T=AFRAME.THREE,d=this.data,s=64,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'rgba(255,255,255,0.9)');g.addColorStop(0.5,'rgba(255,255,255,0.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,s,s);const tex=new T.CanvasTexture(c);tex.needsUpdate=true;const N=d.count,A=d.area,YT=d.yTop,YB=d.yBot;this.geo=new T.BufferGeometry();this.pos=new Float32Array(N*3);this.vy=new Float32Array(N);for(let i=0;i<N;i++){this.pos[3*i]=(Math.random()-0.5)*A*2.2;this.pos[3*i+1]=Math.random()*(YT-YB)+YB;this.pos[3*i+2]=(Math.random()-0.5)*A*2.2;this.vy[i]=d.speed*(0.8+Math.random()*0.8);}this.geo.setAttribute('position',new T.BufferAttribute(this.pos,3));const mat=new T.PointsMaterial({map:tex,size:d.sizePx,sizeAttenuation:false,transparent:true,opacity:d.opacity,alphaTest:0.01,depthTest:false,depthWrite:false});this.points=new T.Points(this.geo,mat);this.points.frustumCulled=false;this.points.renderOrder=998;this.el.object3D.add(this.points);},tick(){const d=this.data,A=d.area,YT=d.yTop,YB=d.yBot,p=this.pos,N=p.length/3;for(let i=0;i<N;i++){p[3*i+1]-=this.vy[i];if(p[3*i+1]<YB){p[3*i+1]=YT+Math.random()*0.2;p[3*i]=(Math.random()-0.5)*A*2.2;p[3*i+2]=(Math.random()-0.5)*A*2.2;}}this.geo.attributes.position.needsUpdate=true;}});
  </script>

  <!-- ===== LLUVIA v2 + SALPICADURAS + NIEBLA v2 (todo en GPU, independiente de los FPS) ===== -->
  <script>
  (function(){
    // Viento compartido: inclinación del celular -> inclinación de la lluvia y deriva de la niebla
    const WIND={x:0,z:0,tx:0,tz:0,on:false};
    function listenTilt(){
      if(WIND.on) return; WIND.on=true;
      window.addEventListener('deviceorientation',e=>{
        if(e.gamma==null) return;
        WIND.tx=Math.max(-1,Math.min(1,e.gamma/45));            // izquierda/derecha
        WIND.tz=Math.max(-1,Math.min(1,((e.beta||45)-45)/60));  // adelante/atrás
      },{passive:true});
    }
    async function askTilt(){
      try{
        if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
          const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted') return;
        }
        listenTilt();
      }catch(e){}
    }
    window.addEventListener('pointerdown',askTilt,{once:true,passive:true});
    askTilt();
    window.__lluviaWind=WIND;

    function stepWind(dt){ const k=1-Math.exp(-dt*1.5); WIND.x+=(WIND.tx-WIND.x)*k; WIND.z+=(WIND.tz-WIND.z)*k; }

    // ---------- LLUVIA: estelas finas, varias capas de profundidad ----------
    AFRAME.registerComponent('lluvia-v2',{
      schema:{
        count:{default:2600}, area:{default:2.4}, depth:{default:1.2}, yTop:{default:1.8}, yBot:{default:-1.6},
        speed:{default:3.0},  len:{default:0.2}, width:{default:0.010},
        slant:{default:0.18}, tiltWind:{default:0.55},
        color:{default:HZC("#E4ECF3")}, opacity:{default:0.75}
      },
      init(){
        const T=AFRAME.THREE,d=this.data,N=d.count;
        const quad=new T.InstancedBufferGeometry();
        quad.setAttribute('position',new T.Float32BufferAttribute([-0.5,0,0, 0.5,0,0, 0.5,1,0, -0.5,1,0],3));
        quad.setIndex([0,1,2, 0,2,3]);
        const seed=new Float32Array(N*4);
        for(let i=0;i<N;i++){
          const depth=Math.random();                       // 0 = cerca, 1 = lejos
          seed[i*4]=Math.random(); seed[i*4+1]=Math.random();
          seed[i*4+2]=Math.random();                       // fase
          seed[i*4+3]=depth;
        }
        quad.setAttribute('aSeed',new T.InstancedBufferAttribute(seed,4));
        quad.instanceCount=N;
        this.u={
          uTime:{value:0}, uArea:{value:d.area}, uDepth:{value:d.depth}, uTop:{value:d.yTop}, uBot:{value:d.yBot},
          uSpeed:{value:d.speed}, uLen:{value:d.len}, uWidth:{value:d.width},
          uWind:{value:new T.Vector2(d.slant,0)}, uColor:{value:new T.Color(d.color)}, uOpacity:{value:d.opacity},
          uBeam:{value:new T.Vector2(-0.3,0.3)}, uBeamK:{value:0}
        };
        const vert=`
          attribute vec4 aSeed;
          uniform float uTime,uArea,uDepth,uTop,uBot,uSpeed,uLen,uWidth,uBeamK; uniform vec2 uWind,uBeam;
          varying vec2 vQ; varying float vA;
          float h(float n){ return fract(sin(n)*43758.5453); }
          void main(){
            float H=uTop-uBot;
            float depth=aSeed.w;
            float sp=uSpeed*mix(1.15,0.7,depth);            // las lejanas caen más lento (paralaje)
            float travel=uTime*sp+aSeed.z*H;
            float cyc=floor(travel/H);
            float fall=travel-cyc*H;
            float id=aSeed.x*917.0+aSeed.y*131.0;
            vec2 xz=vec2((h(id+cyc*7.13)*2.0-1.0)*uArea, 0.02+h(id+cyc*3.71)*uDepth);   // z: entre la página y la cámara
            vec3 dir=normalize(vec3(uWind.x,-1.0,0.0));
            vec3 head=vec3(xz.x,uTop,xz.y)+dir*fall;
            float L=uLen*mix(1.2,0.6,depth);
            vec3 tail=head-dir*L;
            vec4 vh=modelViewMatrix*vec4(head,1.0);
            vec4 vt=modelViewMatrix*vec4(tail,1.0);
            vec2 d2=vt.xy-vh.xy; float dl=length(d2); d2=dl>1e-6?d2/dl:vec2(0.0,1.0);
            vec2 nrm=vec2(-d2.y,d2.x);
            vec4 p=mix(vh,vt,position.y);
            float sc=length(vec3(modelViewMatrix[0][0],modelViewMatrix[0][1],modelViewMatrix[0][2]));   // escala del target (MindAR usa unidades grandes)
            p.xy+=nrm*position.x*uWidth*sc*mix(1.3,0.7,depth);
            gl_Position=projectionMatrix*p;
            vQ=vec2(position.x*2.0,position.y);
            float edge=smoothstep(0.0,0.08,fall/H)*(1.0-smoothstep(0.96,1.0,fall/H));   // nace y muere suave
            vA=edge*mix(1.0,0.45,depth);
            float bd=length(head.xy-uBeam); vA*=1.0+uBeamK*1.6*exp(-bd*bd/0.06);       // gotas iluminadas por el haz
          }`;
        const frag=`
          precision mediump float;
          uniform vec3 uColor; uniform float uOpacity;
          varying vec2 vQ; varying float vA;
          void main(){
            float across=1.0-abs(vQ.x); across*=across;
            float along=pow(1.0-vQ.y,1.6);                 // cabeza brillante, cola que se desvanece
            float a=across*along*vA*uOpacity;
            if(a<0.003) discard;
            gl_FragColor=vec4(uColor,a);
          }`;
        const mat=new T.ShaderMaterial({uniforms:this.u,vertexShader:vert,fragmentShader:frag,transparent:true,depthWrite:false,depthTest:true,side:T.DoubleSide});
        this.mesh=new T.Mesh(quad,mat); this.mesh.frustumCulled=false; this.mesh.renderOrder=997;
        this.el.object3D.add(this.mesh);
      },
      tick(t,dt){
        dt=Math.min(0.05,(dt||16)/1000);
        stepWind(dt);
        const d=this.data,u=this.u;
        u.uTime.value+=dt;
        u.uWind.value.set(d.slant+WIND.x*d.tiltWind, 0);
      },
      remove(){ this.el.object3D.remove(this.mesh); this.mesh.geometry.dispose(); this.mesh.material.dispose(); }
    });

    // ---------- SALPICADURAS: anillos que se abren donde golpea el agua ----------
    AFRAME.registerComponent('salpicaduras',{
      schema:{
        count:{default:70}, areaX:{default:0.5}, areaY:{default:0.7}, z:{default:0.004},
        period:{default:0.9}, radius:{default:0.06},
        color:{default:HZC('#E6EEF5')}, opacity:{default:0.7}
      },
      init(){
        const T=AFRAME.THREE,d=this.data,N=d.count;
        const g=new T.InstancedBufferGeometry();
        g.setAttribute('position',new T.Float32BufferAttribute([-1,-1,0, 1,-1,0, 1,1,0, -1,1,0],3));
        g.setIndex([0,1,2, 0,2,3]);
        const seed=new Float32Array(N*3);
        for(let i=0;i<N;i++){ seed[i*3]=Math.random(); seed[i*3+1]=Math.random(); seed[i*3+2]=0.6+Math.random()*0.8; }
        g.setAttribute('aSeed',new T.InstancedBufferAttribute(seed,3));
        g.instanceCount=N;
        this.u={uTime:{value:0},uArea:{value:new T.Vector2(d.areaX,d.areaY)},uZ:{value:d.z},uPeriod:{value:d.period},uR:{value:d.radius},uColor:{value:new T.Color(d.color)},uOpacity:{value:d.opacity}};
        const vert=`
          attribute vec3 aSeed;
          uniform float uTime,uZ,uPeriod,uR; uniform vec2 uArea;
          varying vec2 vUv; varying float vT;
          float h(float n){ return fract(sin(n)*43758.5453); }
          void main(){
            float per=uPeriod*aSeed.z;
            float k=uTime/per+aSeed.x*7.0;
            float cyc=floor(k); float t=k-cyc;
            float id=aSeed.x*311.0+aSeed.y*977.0;
            vec2 c=(vec2(h(id+cyc*1.7),h(id+cyc*5.3))*2.0-1.0)*uArea;
            float r=uR*aSeed.z;
            vec3 p=vec3(c.x+position.x*r, c.y+position.y*r, uZ);
            gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
            vUv=position.xy; vT=t;
          }`;
        const frag=`
          precision mediump float;
          uniform vec3 uColor; uniform float uOpacity;
          varying vec2 vUv; varying float vT;
          void main(){
            float d=length(vUv);
            float t=vT;
            float r1=t; float r2=max(0.0,t-0.25)*1.2;
            float w=0.06+0.08*t;
            float ring=exp(-pow((d-r1)/w,2.0))+0.55*exp(-pow((d-r2)/w,2.0));
            float splash=exp(-d*d*60.0)*(1.0-smoothstep(0.0,0.12,t));    // destello del impacto
            float a=(ring*pow(1.0-t,1.8)+splash)*uOpacity*step(d,1.0);
            if(a<0.003) discard;
            gl_FragColor=vec4(uColor,a);
          }`;
        const mat=new T.ShaderMaterial({uniforms:this.u,vertexShader:vert,fragmentShader:frag,transparent:true,depthWrite:false,depthTest:true,side:T.DoubleSide});
        this.mesh=new T.Mesh(g,mat); this.mesh.frustumCulled=false; this.mesh.renderOrder=996;
        this.el.object3D.add(this.mesh);
      },
      tick(t,dt){ this.u.uTime.value+=Math.min(0.05,(dt||16)/1000); },
      remove(){ this.el.object3D.remove(this.mesh); this.mesh.geometry.dispose(); this.mesh.material.dispose(); }
    });

    // ---------- NIEBLA v2: bancos de bruma que derivan, giran y respiran ----------
    AFRAME.registerComponent('niebla-v2',{
      schema:{
        count:{default:46}, area:{default:1.6}, yMin:{default:-0.9}, yMax:{default:0.9}, zMax:{default:0.45},
        size:{default:1.3}, drift:{default:0.06}, tiltWind:{default:0.12},
        color:{default:HZC('#EEE9E0')}, opacity:{default:0.16}
      },
      init(){
        const T=AFRAME.THREE,d=this.data,N=d.count;
        // textura de bruma: muchas manchas suaves superpuestas = borde irregular, no un círculo
        const S=256,c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
        for(let i=0;i<70;i++){
          const a=Math.random()*Math.PI*2, rr=Math.random()*S*0.26;
          const cx=S/2+Math.cos(a)*rr, cy=S/2+Math.sin(a)*rr, r=S*(0.08+Math.random()*0.18);
          const gr=x.createRadialGradient(cx,cy,0,cx,cy,r);
          gr.addColorStop(0,'rgba(255,255,255,0.22)'); gr.addColorStop(1,'rgba(255,255,255,0)');
          x.fillStyle=gr; x.fillRect(0,0,S,S);
        }
        const tex=new T.CanvasTexture(c); tex.needsUpdate=true;
        const g=new T.InstancedBufferGeometry();
        g.setAttribute('position',new T.Float32BufferAttribute([-0.5,-0.5,0, 0.5,-0.5,0, 0.5,0.5,0, -0.5,0.5,0],3));
        g.setIndex([0,1,2, 0,2,3]);
        const s1=new Float32Array(N*4), s2=new Float32Array(N*4);
        for(let i=0;i<N;i++){
          s1[i*4]=(Math.random()*2-1)*d.area; s1[i*4+1]=d.yMin+Math.random()*(d.yMax-d.yMin); s1[i*4+2]=Math.random()*d.zMax;
          s1[i*4+3]=d.size*(0.55+Math.random()*0.9);
          s2[i*4]=Math.random()*6.283; s2[i*4+1]=(Math.random()*2-1)*0.12;   // ángulo y giro
          s2[i*4+2]=Math.random()*6.283; s2[i*4+3]=0.6+Math.random()*0.8;      // fase y ritmo de respiración
        }
        g.setAttribute('aA',new T.InstancedBufferAttribute(s1,4));
        g.setAttribute('aB',new T.InstancedBufferAttribute(s2,4));
        g.instanceCount=N;
        this.u={uTime:{value:0},uArea:{value:d.area},uOff:{value:0},uMap:{value:tex},uColor:{value:new T.Color(d.color)},uOpacity:{value:d.opacity}};
        const vert=`
          attribute vec4 aA; attribute vec4 aB;
          uniform float uTime,uArea,uOff;
          varying vec2 vUv; varying float vA;
          void main(){
            float x=mod(aA.x+uOff+uArea,2.0*uArea)-uArea;     // deriva lateral, vuelve a entrar por el otro lado
            vec3 center=vec3(x,aA.y+0.04*sin(uTime*0.3+aB.z),aA.z);
            vec4 mv=modelViewMatrix*vec4(center,1.0);
            float ang=aB.x+aB.y*uTime;
            vec2 q=position.xy; q=vec2(q.x*cos(ang)-q.y*sin(ang), q.x*sin(ang)+q.y*cos(ang));
            float sc=length(vec3(modelViewMatrix[0][0],modelViewMatrix[0][1],modelViewMatrix[0][2]));
            mv.xy+=q*aA.w*sc;
            gl_Position=projectionMatrix*mv;
            vUv=position.xy+0.5;
            float edge=1.0-smoothstep(0.65,1.0,abs(x)/uArea);   // se desvanece en los bordes del área
            vA=edge*(0.55+0.45*sin(uTime*0.35*aB.w+aB.z));
          }`;
        const frag=`
          precision mediump float;
          uniform sampler2D uMap; uniform vec3 uColor; uniform float uOpacity;
          varying vec2 vUv; varying float vA;
          void main(){
            float a=texture2D(uMap,vUv).a*vA*uOpacity;
            if(a<0.004) discard;
            gl_FragColor=vec4(uColor,a);
          }`;
        const mat=new T.ShaderMaterial({uniforms:this.u,vertexShader:vert,fragmentShader:frag,transparent:true,depthWrite:false,depthTest:true});
        this.mesh=new T.Mesh(g,mat); this.mesh.frustumCulled=false; this.mesh.renderOrder=995;
        this.el.object3D.add(this.mesh);
      },
      tick(t,dt){
        dt=Math.min(0.05,(dt||16)/1000);
        const d=this.data,u=this.u;
        u.uTime.value+=dt;
        u.uOff.value+=(d.drift+WIND.x*d.tiltWind)*dt;
      },
      remove(){ this.el.object3D.remove(this.mesh); this.mesh.geometry.dispose(); this.mesh.material.dispose(); }
    });
  })();
  </script>

  <!-- BRILLO-MALLA: brillo propio, halo de borde y aura sobre una malla elegida por nombre -->
  <script>
  AFRAME.registerComponent('brillo-malla',{
    multiple:true,
    schema:{
      mesh:{default:'Infinity_loop'},
      color:{default:HZC('#FFB45A')},      // tono del brillo
      intensity:{default:0.55},        // brillo propio del metal
      metalness:{default:0.35},
      halo:{default:1.3},             // fuerza del halo
      haloSize:{default:0.06},
      aura:{default:0.55},            // resplandor difuso detrás (0 = sin aura)       // grosor del halo (relativo al tamaño del infinito)
      pulse:{default:0.25},           // cuánto late (0 = fijo)
      period:{default:3.2},           // segundos por latido
      useMap:{default:true},          // el brillo toma la textura del metal
      opaque:{default:false}          // fuerza opacidad total (para la pirámide)
    },
    init(){
      this.t=0; this.halos=[]; this.mats=[];
      const apply=()=>{
        const T=AFRAME.THREE,d=this.data,root=this.el.getObject3D('mesh'); if(!root) return;
        const targets=[];
        root.traverse(o=>{
          if(!o.isMesh) return;
          const norm=v=>(v||'').toLowerCase().replace(/[^a-z0-9]/g,''); let n=o, hit=false; while(n){ if(d.mesh==='*'||norm(n.name)===norm(d.mesh)){hit=true;break;} n=n.parent; }
          if(hit) targets.push(o);
        });
        targets.forEach(o=>{
          const m=o.material.clone();
          m.emissive=new T.Color(d.color);
          if(m.map && d.useMap) m.emissiveMap=m.map;
          if(d.opaque){ m.transparent=false; m.opacity=1; m.depthWrite=true; }
          if(!d.useMap){ m.map=null; m.color=new T.Color(d.color).multiplyScalar(0.35); }   // tono puro, sin la textura del metal
          m.emissiveIntensity=d.intensity;
          m.metalness=d.metalness; m.roughness=Math.min(m.roughness,0.45);
          m.needsUpdate=true; o.material=m; this.mats.push(m);
          // halo: cáscara exterior con brillo de borde (fresnel), suma luz
          o.geometry.computeBoundingSphere();
          const r=o.geometry.boundingSphere.radius;
          const u={uColor:{value:new T.Color(d.color)},uStr:{value:d.halo},uGrow:{value:d.haloSize*r}};
          const sm=new T.ShaderMaterial({
            uniforms:u, transparent:true, depthWrite:false, blending:T.AdditiveBlending, side:T.FrontSide,
            vertexShader:`uniform float uGrow; varying vec3 vN; varying vec3 vV;
              void main(){ vec3 p=position+normal*uGrow; vec4 mv=modelViewMatrix*vec4(p,1.0);
                vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
            fragmentShader:`uniform vec3 uColor; uniform float uStr; varying vec3 vN; varying vec3 vV;
              void main(){ float f=1.0-abs(dot(normalize(vN),normalize(vV))); f=pow(f,2.2);
                gl_FragColor=vec4(uColor*f*uStr, f*uStr); }`
          });
          const h=new T.Mesh(o.geometry,sm); h.renderOrder=20; o.add(h); this.halos.push(u);
          // aura: resplandor difuso centrado en el infinito
          if(d.aura>0){
            const S=128,c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
            const gr=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
            gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.35,'rgba(255,255,255,0.35)'); gr.addColorStop(1,'rgba(255,255,255,0)');
            x.fillStyle=gr; x.fillRect(0,0,S,S);
            const am=new T.SpriteMaterial({map:new T.CanvasTexture(c),color:new T.Color(d.color),transparent:true,depthWrite:false,blending:T.AdditiveBlending,opacity:d.aura});
            const sp=new T.Sprite(am); sp.position.copy(o.geometry.boundingSphere.center); sp.scale.setScalar(r*2.6); sp.renderOrder=19;
            o.add(sp); this.auras=this.auras||[]; this.auras.push(am);
          }
        });
      };
      if(this.el.getObject3D('mesh')) apply(); else this.el.addEventListener('model-loaded',apply,{once:true});
    },
    tick(t,dt){
      if(!this.mats.length) return;
      const d=this.data; this.t+=Math.min(0.05,(dt||16)/1000);
      const k=1+d.pulse*Math.sin(this.t*2*Math.PI/d.period);
      this.mats.forEach(m=>m.emissiveIntensity=d.intensity*k);
      this.halos.forEach(u=>u.uStr.value=d.halo*k);
      (this.auras||[]).forEach(a=>a.opacity=d.aura*k);
    }
  });
  </script>

  <!-- GÉNESIS: los puntos forman el modelo, aparece el modelo y luego crece la hélice -->
  <script>
  AFRAME.registerComponent('genesis',{
    schema:{
      color:{default:HZC('#F2C46A')},
      size:{default:0.016},        // tamaño de cada punto
      gather:{default:4.5},        // segundos que tardan en formar el cerebro
      modelIn:{default:1.6},       // segundos de aparición del modelo
      dnaDelay:{default:0.6},      // pausa antes de que crezca el ADN
      dnaGrow:{default:3.5},       // segundos que tarda en crecer la hélice
      dnaBend:{default:3.0}        // segundos en que la hélice se curva hasta cerrarse como aureola
    },
    init(){
      const T=AFRAME.THREE,d=this.data;
      this.model=this.el.querySelector('a-gltf-model');
      this.dna=this.el.querySelector('[dna-helix]');
      this.t=0; this.running=false; this.mats=null; this.modelT=null;
      // --- nube de puntos a partir de los datos precalculados ---
      hzForma(this.model,6000,tgt=>{ const N=tgt.length/3;
      const c=new T.Vector3(); for(let i=0;i<N;i++){ c.x+=tgt[i*3]; c.y+=tgt[i*3+1]; c.z+=tgt[i*3+2]; } c.multiplyScalar(1/N);
      let R=0; for(let i=0;i<N;i++) R=Math.max(R,Math.hypot(tgt[i*3]-c.x,tgt[i*3+1]-c.y,tgt[i*3+2]-c.z));
      const src=new Float32Array(N*3), tim=new Float32Array(N*2), rnd=new Float32Array(N);
      for(let i=0;i<N;i++){
        const u=Math.random()*2-1, a=Math.random()*Math.PI*2, rr=R*(1.6+Math.random()*1.8), s=Math.sqrt(1-u*u);
        src.set([c.x+rr*s*Math.cos(a), c.y+rr*u, c.z+rr*s*Math.sin(a)],i*3);

  <!-- CONSTRUYE-ARISTAS: la malla se dibuja con luz desde la base al vértice y luego la recorre un pulso -->
  <script>

    schema:{
      mesh:{default:'PIRAMIDE ABAJO.002'},

        if(this.crossAuraMat) this.crossAuraMat.opacity=d.crossAura*ce*(br+U.uPulseStr.value*0.4); }
      if(this.auraMat){ const b=Math.min(1,s/1.2); this.auraMat.opacity=d.aura*b*(0.75+0.25*Math.sin(s*2*Math.PI/4.5)+U.uPulseStr.value*0.5+U.uFront.value*0.4*(k<1?1-k:0)); }
    }
  });
  </script>

  <!-- MARCO-LUZ (todos los targets): la luz recorre el trazo del marco de cada imagen -->
  <script>
  // máscaras del marco de cada trigger: HZ_DATOS.marcos[n] = [trazo nítido 1024px, brillo (G cercano, B resplandor)] (las genera preparar.html)
  AFRAME.registerComponent('marco-luz',{
    schema:{
      src:{default:0},                // número de trigger
      color:{default:HZC('#FFC46A')},      // luz dorada
      hot:{default:HZC('#FFF1C8')},        // frente de luz
      strength:{default:1.0},
      build:{default:2.4},            // segundos que tarda la luz en entrar desde el borde
      sweep:{default:11},             // segundos de una vuelta de la luz alrededor del marco
      w:{default:1}, h:{default:1}    // tamaño de la imagen en el ancla
    },
    init(){
      const T=AFRAME.THREE,d=this.data; this.t=0; this.running=false;
      this.anchor=this.el.closest('[mindar-image-target],[hz-ancla]')||this.el;
      const L=new T.TextureLoader(), an=(this.el.sceneEl.renderer&&this.el.sceneEl.renderer.capabilities.getMaxAnisotropy())||4;
      const V=window.HZ_DATOS.marcos[d.src]; if(!V){ this.off=true; return; }   // sin marco generado para este trigger: no dibuja nada
      const tex=L.load(V[0]); tex.minFilter=T.LinearMipmapLinearFilter; tex.magFilter=T.LinearFilter; tex.anisotropy=an;
      const glo=L.load(V[1]); glo.minFilter=T.LinearMipmapLinearFilter;
      this.u={uMask:{value:tex},uGlow:{value:glo},uT:{value:0},uB:{value:0},uDone:{value:0},uFade:{value:0},uStr:{value:d.strength},uSweep:{value:d.sweep},uColor:{value:new T.Color(d.color)},uHot:{value:new T.Color(d.hot)}};
      const mat=new T.ShaderMaterial({uniforms:this.u,transparent:true,depthWrite:false,
        // suma solo luz: no escribe opacidad en el lienzo, así la cámara de fondo nunca queda tapada
        blending:T.CustomBlending,blendEquation:T.AddEquation,blendSrc:T.OneFactor,blendDst:T.OneFactor,blendSrcAlpha:T.ZeroFactor,blendDstAlpha:T.OneFactor,
        vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader:`precision mediump float; uniform sampler2D uMask,uGlow; uniform float uT,uB,uDone,uFade,uStr,uSweep; uniform vec3 uColor,uHot; varying vec2 vUv;
          void main(){ vec3 m=vec3(texture2D(uMask,vUv).r, texture2D(uGlow,vUv).gb); if(m.r+m.b<0.004) discard;
            vec2 c=vUv-0.5; float dd=0.5-max(abs(c.x),abs(c.y));
            float fr=uB*0.56; float lit=smoothstep(fr,fr-0.05,dd); float band=exp(-pow((dd-fr)/0.035,2.0))*(1.0-uDone);
            float a=atan(c.y,c.x); float sw=pow(0.5+0.5*cos(a-uT*6.2832/uSweep),5.0);
            float br=0.82+0.18*sin(uT*6.2832/5.0);
            vec3 col=uColor*(m.r*0.5+m.g*0.3+m.b*0.22)*lit*br*(0.55+0.9*sw)+uHot*(m.r*1.1+m.g*0.5)*band;
            gl_FragColor=vec4(col*uStr*uFade,0.0); }`});
      this.mesh=new T.Mesh(new T.PlaneGeometry(d.w,d.h),mat); this.mesh.position.z=0.002; this.mesh.renderOrder=2;
      this.el.setObject3D('vitral',this.mesh);
      if(this.anchor!==this.el||this.anchor.components['mindar-image-target']){
        this.anchor.addEventListener('targetFound',()=>this.start());
        this.anchor.addEventListener('targetLost',()=>{ clearTimeout(this._lostT); this._lostT=setTimeout(()=>this.reset(),2000); });
      }
    },
    start(){ if(this.off) return; clearTimeout(this._lostT); if(this.running) return; this.running=true; this.t=0; },
    reset(){ if(this.off) return; this.running=false; this.t=0; this.u.uFade.value=0; this.u.uB.value=0; },
    tick(t,dt){
      if(this.off) return;
      if(!this.running){ if(this.anchor.object3D.visible && (this.anchor.components['mindar-image-target']||this.anchor===this.el)) this.start(); else return; }
      const d=this.data,u=this.u; this.t+=Math.min(0.05,(dt||16)/1000); const s=this.t;
      const k=Math.min(1,s/d.build); u.uB.value=k<1?1-Math.pow(1-k,2):1.2; u.uDone.value=Math.min(1,Math.max(0,(s-d.build)/0.6));
      u.uFade.value=Math.min(1,s/0.4); u.uT.value=s;
    }
  });
  </script>

  <!-- CONDENSACIÓN: un foco de luz → la materia se condensa en el modelo → rayos, polvo que sube y balanceo lento -->
  <script>
  AFRAME.registerComponent('condensacion',{
    schema:{
      host:{type:'vec3',default:{x:-0.002,y:0.647,z:0.003}},   // foco de luz, en el espacio del modelo
      hostAuto:{default:true},            // true: el foco se ubica solo (centro del modelo, al 65% de su altura)
      vidrio:{default:''},                // parte del nombre de la malla que se trata como vidrio iluminado ('' = ninguna)
      metal:{default:'*'},                // parte del nombre de la malla que se vuelve metal ('*' = todas las demás)
      respaldo:{default:''},              // GLB alternativo si el principal no carga
      gold:{default:HZC('#E8B860')},
      light:{default:HZC('#FFE9C2')},          // luz del foco (blanco cálido)
      size:{default:0.012},               // tamaño de los puntos de oro
      seed:{default:0.9},                 // segundos del punto de luz antes de que salga el oro
      gather:{default:3.4},               // segundos que tarda el oro en formar el modelo
      modelIn:{default:1.6},
      raysIn:{default:2.0},
      raysR:{default:0.42},               // radio de los rayos (1 = ancho de la página)
      sway:{default:11},                  // grados del balanceo
      swayPeriod:{default:14},            // segundos por balanceo completo
      incense:{default:220}               // partículas de polvo
    },
    init(){
      const T=AFRAME.THREE,d=this.data;
      this.model=this.el.querySelector('a-gltf-model');
      this.t=0; this.running=false; this.mats=null; this.modelT=null;
      // si el modelo falla: se confirma si realmente falta en el servidor; si está, se reintenta; si no, se usa el respaldo
      this.model.addEventListener('model-error',()=>{
        if(this._fb) return; this._fb=true; const CUR=this.model.getAttribute('src'), URL=hzClave(CUR)===CUR?CUR:(document.querySelector(CUR)||{getAttribute:()=>CUR}).getAttribute('src');
        fetch(URL,{method:'HEAD',cache:'no-store'}).then(r=>{ if(r.ok) this.model.setAttribute('src',URL); else if(this.data.respaldo) this.model.setAttribute('src',this.data.respaldo); })
          .catch(()=>{ if(this.data.respaldo) this.model.setAttribute('src',this.data.respaldo); });
      });
      const S=128,cv=document.createElement('canvas'); cv.width=cv.height=S; const cx=cv.getContext('2d');
      const gr=cx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.15,'rgba(255,255,255,0.85)'); gr.addColorStop(0.45,'rgba(255,255,255,0.2)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      cx.fillStyle=gr; cx.fillRect(0,0,S,S); const glowTex=new T.CanvasTexture(cv);
      const H=new T.Vector3(d.host.x,d.host.y,d.host.z);
      // ---- 1) el oro: nace en el foco y se condensa en la forma de el modelo ----
      hzForma(this.model,5000,tgt=>{ const N=tgt.length/3;
      if(d.hostAuto){ const bb=new T.Box3(); for(let i=0;i<N;i++) bb.expandByPoint(new T.Vector3(tgt[i*3],tgt[i*3+1],tgt[i*3+2]));
        const cc=bb.getCenter(new T.Vector3()); H.set(cc.x,bb.min.y+(bb.max.y-bb.min.y)*0.65,cc.z); }
      this.H=H; this._foco();
      let R=0; for(let i=0;i<N;i++) R=Math.max(R,Math.hypot(tgt[i*3]-H.x,tgt[i*3+1]-H.y,tgt[i*3+2]-H.z));
      const src=new Float32Array(N*3), tim=new Float32Array(N*2), rnd=new Float32Array(N);
      for(let i=0;i<N;i++){
        const a=Math.random()*Math.PI*2, u=Math.random()*2-1, s=Math.sqrt(1-u*u), rr=0.01+Math.random()*0.03;
        src.set([H.x+rr*s*Math.cos(a), H.y+rr*u, H.z+rr*s*Math.sin(a)],i*3);
        const dist=Math.hypot(tgt[i*3]-H.x,tgt[i*3+1]-H.y,tgt[i*3+2]-H.z)/R;       // lo cercano a el foco se forma primero
        tim.set([d.seed+(0.75*dist+0.25*Math.random())*d.gather*0.55, d.gather*0.45*(0.7+0.6*Math.random())],i*2);
        rnd[i]=Math.random();
      }
      const g=new T.BufferGeometry();
      g.setAttribute('position',new T.BufferAttribute(tgt,3)); g.setAttribute('aSrc',new T.BufferAttribute(src,3));
      g.setAttribute('aTime',new T.BufferAttribute(tim,2)); g.setAttribute('aRnd',new T.BufferAttribute(rnd,1));
      this.u={uTime:{value:0},uAlpha:{value:1},uSize:{value:d.size},uViewH:{value:800},uColor:{value:new T.Color(d.gold)},uMap:{value:glowTex}};
      const ptsMat=new T.ShaderMaterial({uniforms:this.u,transparent:true,depthWrite:false,blending:T.AdditiveBlending,
        vertexShader:`attribute vec3 aSrc; attribute vec2 aTime; attribute float aRnd;
          uniform float uTime,uSize,uViewH; varying float vA;
          void main(){
            float k=clamp((uTime-aTime.x)/aTime.y,0.0,1.0); float e=k*k*(3.0-2.0*k);
            vec3 p=mix(aSrc,position,e);
            p+=vec3(sin(uTime*1.2+aRnd*40.0),cos(uTime*1.0+aRnd*30.0),sin(uTime*0.8+aRnd*20.0))*0.003*e;
            vec4 mv=modelViewMatrix*vec4(p,1.0);
            float sc=length(vec3(modelViewMatrix[0][0],modelViewMatrix[0][1],modelViewMatrix[0][2]));
            gl_PointSize=clamp(uSize*sc*projectionMatrix[1][1]*uViewH*0.5/max(1e-4,abs(mv.z)),1.5,48.0)*(0.6+0.8*aRnd);
            gl_Position=projectionMatrix*mv;
            vA=clamp((uTime-aTime.x)/0.25,0.0,1.0)*(0.5+0.5*e);
          }`,
        fragmentShader:`precision mediump float; uniform sampler2D uMap; uniform vec3 uColor; uniform float uAlpha; varying float vA;
          void main(){ float a=texture2D(uMap,gl_PointCoord).a*vA*uAlpha; if(a<0.004) discard; gl_FragColor=vec4(uColor*a,a); }`});
      this.pts=new T.Points(g,ptsMat); this.pts.frustumCulled=false; this.pts.renderOrder=40; this.pts.visible=false;
      this.model.object3D.add(this.pts);
      if(this._pend){ this._pend=false; this.start(); } });
      // ---- 2) la luz del foco: la más blanca de la escena ----
      this.hostMat=new T.SpriteMaterial({map:glowTex,color:new T.Color(d.light),transparent:true,depthWrite:false,depthTest:false,blending:T.AdditiveBlending,opacity:0});
      this.hostSp=new T.Sprite(this.hostMat); this.hostSp.position.copy(H); this.hostSp.scale.setScalar(0.001); this.hostSp.renderOrder=60;
      this.model.object3D.add(this.hostSp);
      // ---- 3) rayos de luz dorada desdel foco (siempre de frente a quien mira) ----
      this.ru={uTime:{value:0},uStr:{value:0},uLen:{value:0},uR:{value:d.raysR},uColor:{value:new T.Color(d.gold)},uCore:{value:new T.Color(d.light)}};
      const rm=new T.ShaderMaterial({uniforms:this.ru,transparent:true,depthWrite:false,depthTest:false,blending:T.AdditiveBlending,
        vertexShader:`uniform float uR; varying vec2 vP;
          void main(){ vec4 mv=modelViewMatrix*vec4(0.0,0.0,0.0,1.0);
            float sc=length(vec3(modelViewMatrix[0][0],modelViewMatrix[0][1],modelViewMatrix[0][2]));
            mv.xy+=position.xy*uR*sc; vP=position.xy; gl_Position=projectionMatrix*mv; }`,
        fragmentShader:`precision mediump float; uniform float uTime,uStr,uLen; uniform vec3 uColor,uCore; varying vec2 vP;
          float h(float n){ return fract(sin(n)*43758.5453); }
          float rays(float a,float r,float n,float rot,float sharp,float seed){
            float x=(a+rot)/6.28318*n; float id=floor(x+0.5); float f=x-id;
            float len=(0.45+0.55*h(id+seed))*uLen; float w=exp(-f*f*sharp);
            return w*smoothstep(len,len*0.35,r)*smoothstep(0.06,0.16,r); }
          void main(){ float r=length(vP); if(r>1.0) discard; float a=atan(vP.y,vP.x);
            float t=uTime; float rot=t*0.02;
            float v=rays(a,r,24.0,rot,60.0,1.0)+0.6*rays(a,r,37.0,-rot*0.7,120.0,7.0);
            v*=0.75+0.25*sin(t*0.9);                                     // latido muy suave
            float core=exp(-r*r*80.0)*uLen;
            vec3 col=uColor*v+uCore*core*0.25; float al=(v+core)*uStr;
            if(al<0.003) discard; gl_FragColor=vec4(col*uStr,al); }`});
      this.rays=new T.Mesh(new T.PlaneGeometry(2,2),rm); this.rays.position.copy(H); this.rays.frustumCulled=false; this.rays.renderOrder=30; this.rays.visible=false;
      this.model.object3D.add(this.rays);
      // ---- 4) polvo: polvo dorado que sube lento desde la base ----
      const M=d.incense, ip=new Float32Array(M*3), ir=new Float32Array(M*4);
      for(let i=0;i<M;i++){ const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*0.16; ip.set([Math.cos(a)*r,0.06,Math.sin(a)*r*0.6],i*3); ir.set([Math.random(),Math.random(),Math.random(),Math.random()],i*4); }
      const ig=new T.BufferGeometry(); ig.setAttribute('position',new T.BufferAttribute(ip,3)); ig.setAttribute('aR',new T.BufferAttribute(ir,4));
      this.iu={uTime:{value:0},uAlpha:{value:0},uSize:{value:0.02},uViewH:{value:800},uColor:{value:new T.Color(d.gold)},uMap:{value:glowTex}};
      const im=new T.ShaderMaterial({uniforms:this.iu,transparent:true,depthWrite:false,blending:T.AdditiveBlending,
        vertexShader:`attribute vec4 aR; uniform float uTime,uSize,uViewH; varying float vA;
          void main(){ float life=7.0+5.0*aR.x; float k=fract(uTime/life+aR.y);
            vec3 p=position; p.y+=k*1.05;                                                    // sube hasta lo alto de el modelo
            p.x+=sin(uTime*0.35+aR.z*12.0+k*4.0)*0.06*k; p.z+=cos(uTime*0.3+aR.w*12.0)*0.03*k;   // deriva como humo
            vec4 mv=modelViewMatrix*vec4(p,1.0);
            float sc=length(vec3(modelViewMatrix[0][0],modelViewMatrix[0][1],modelViewMatrix[0][2]));
            gl_PointSize=clamp(uSize*(0.6+1.6*k)*sc*projectionMatrix[1][1]*uViewH*0.5/max(1e-4,abs(mv.z)),1.0,40.0);
            gl_Position=projectionMatrix*mv; vA=smoothstep(0.0,0.15,k)*(1.0-smoothstep(0.55,1.0,k))*(0.4+0.6*aR.w); }`,
        fragmentShader:`precision mediump float; uniform sampler2D uMap; uniform vec3 uColor; uniform float uAlpha; varying float vA;
          void main(){ float a=texture2D(uMap,gl_PointCoord).a*vA*uAlpha*0.85; if(a<0.004) discard; gl_FragColor=vec4(uColor*a,a); }`});
      this.inc=new T.Points(ig,im); this.inc.frustumCulled=false; this.inc.renderOrder=25; this.inc.visible=false;
      this.model.object3D.add(this.inc);
      this._foco();
      // ---- el modelo real: oro con luz propia y luneta blanca; aparece con fundido ----
      const prep=()=>{ const root=this.model.getObject3D('mesh'); if(!root) return;
        this.mats=[]; root.traverse(o=>{ if(!o.isMesh) return; const m=o.material.clone(); const n=(o.name||'').toLowerCase();
          if(d.vidrio && n.includes(d.vidrio.toLowerCase())){ m.color=new T.Color(HZC('#B9A888')); m.metalness=0.0; m.roughness=0.9; m.emissive=new T.Color(d.light); m.emissiveIntensity=0.14; }
          else if(d.metal==='*' || (d.metal && n.includes(d.metal.toLowerCase()))){ m.metalness=1.0; m.roughness=0.26; m.envMap=this.envMap(); m.envMapIntensity=2.1; m.emissive=new T.Color(HZC('#000000')); m.emissiveIntensity=0; }
          o.material=m; this.mats.push(m); });
        if(this.modelT===null) this.setModelOpacity(0); };
      this.model.addEventListener('model-loaded',prep);
      if(this.model.getObject3D('mesh')) prep();
      this.el.addEventListener('targetFound',()=>this.start());
      this.el.addEventListener('targetLost',()=>{ clearTimeout(this._lostT); this._lostT=setTimeout(()=>this.reset(),2000); });
    },
    _foco(){ if(this.H && this.hostSp){ this.hostSp.position.copy(this.H); this.rays.position.copy(this.H); } },
    envMap(){
      if(this._env) return this._env;
      const T=AFRAME.THREE, r=this.el.sceneEl.renderer, W=512,Hh=256, c=document.createElement('canvas'); c.width=W; c.height=Hh; const x=c.getContext('2d');
      // estudio en penumbra: fondo casi negro cálido y fuentes de luz recortadas alrededor (cada cara del oro refleja algo distinto)
      const bg=x.createLinearGradient(0,0,0,Hh); bg.addColorStop(0,HZC('#3a2810')); bg.addColorStop(0.5,HZC('#1e1308')); bg.addColorStop(1,HZC('#080403'));
      x.fillStyle=bg; x.fillRect(0,0,W,Hh);
      const box=(u,v,w,h,col,blur)=>{ x.save(); x.filter='blur('+blur+'px)'; x.fillStyle=col; x.fillRect(u*W-w*W/2,v*Hh-h*Hh/2,w*W,h*Hh); x.restore(); };
      box(0.12,0.30,0.07,0.50,HZC('#FFF4DC'),6);   // tiras de luz verticales a distintos ángulos
      box(0.37,0.25,0.07,0.40,HZC('#FFE2A8'),6);
      box(0.62,0.35,0.09,0.55,HZC('#FFF0D0'),7);
      box(0.87,0.28,0.06,0.45,HZC('#FFD890'),6);
      box(0.50,0.06,0.70,0.08,HZC('#FFEFD0'),8);   // luz cenital
      box(0.25,0.78,0.20,0.06,HZC('#7A5020'),10);  // rebote cálido bajo, tenue
      const tex=new T.CanvasTexture(c); tex.mapping=T.EquirectangularReflectionMapping; tex.colorSpace=T.SRGBColorSpace;
      try{ const pm=new T.PMREMGenerator(r); this._env=pm.fromEquirectangular(tex).texture; pm.dispose(); }catch(e){ this._env=tex; }
      return this._env;
    },
    setModelOpacity(a){
      if(!this.mats) return;
      this.mats.forEach(m=>{ m.transparent=a<0.999; m.opacity=a; m.depthWrite=a>0.6; });
      const root=this.model.getObject3D('mesh'); if(root) root.visible=a>0.001;
    },
    start(){
      clearTimeout(this._lostT); if(this.running) return;
      if(!this.pts){ this._pend=true; return; }
      this.t=0; this.running=true; this.modelT=null;
      this.u.uTime.value=0; this.u.uAlpha.value=1; this.pts.visible=true; this.rays.visible=true; this.inc.visible=true;
      this.ru.uStr.value=0; this.ru.uLen.value=0; this.iu.uAlpha.value=0; this.setModelOpacity(0);
    },
    reset(){ this.running=false; this._pend=false; if(this.pts) this.pts.visible=false; this.rays.visible=false; this.inc.visible=false; this.hostMat.opacity=0; this.modelT=null; this.setModelOpacity(0); this.model.object3D.rotation.y=0; },
    tick(t,dt){
      if(!this.running){ if(this.el.components['mindar-image-target'] && this.el.object3D.visible) this.start(); if(!this.running) return; }
      const d=this.data, st=Math.min(0.05,(dt||16)/1000); this.t+=st; const s=this.t;
      const sm=x=>{ x=Math.min(1,Math.max(0,x)); return x*x*(3-2*x); };
      const r=this.el.sceneEl.renderer; if(r){ const hgt=r.getContext().drawingBufferHeight; this.u.uViewH.value=hgt; this.iu.uViewH.value=hgt; }
      this.u.uTime.value=s; this.ru.uTime.value=s; this.iu.uTime.value=s;
      // punto de luz del foco: nace, crece y queda respirando
      const born=sm(s/d.seed); const breath=0.88+0.12*Math.sin(s*1.1);
      const settle=1-0.45*sm((s-d.seed-d.gather)/2.0);                 // al aparecer el modelo, la luz se recoge
      this.hostMat.opacity=born*breath*(0.35+0.65*(1-sm((s-d.seed-d.gather)/2.0)))*0.55; this.hostSp.scale.setScalar(0.03+0.085*born*breath*settle);
      // el modelo aparece cuando el oro ya formó el modelo (y el archivo terminó de bajar)
      const formed=d.seed+d.gather*0.9;
      if(this.mats && this.modelT===null && s>=formed) this.modelT=s;
      if(this.modelT!==null){
        const k=sm((s-this.modelT)/d.modelIn); this.setModelOpacity(k);
        this.u.uAlpha.value=1-0.92*sm((s-this.modelT-d.modelIn*0.5)/1.6);    // el oro se disuelve en polvo
      }
      // rayos e polvo, después de la forma
      const ri=sm((s-formed-0.4)/d.raysIn);
      this.ru.uLen.value=ri; this.ru.uStr.value=1.0*ri;
      this.iu.uAlpha.value=sm((s-formed)/3.0);
      // balanceo lento, como una mirada que la rodea con respeto (entra suave)
      const amp=d.sway*Math.PI/180*sm((s-formed)/4.0);
      this.model.object3D.rotation.y=Math.sin(s*2*Math.PI/d.swayPeriod)*amp;
    }
  });

  <!-- REVELA-BAJO-AGUA: la onda queda intacta; la imagen está en el fondo de esa misma agua y cada gota abre un claro que la devela -->
  <script>
  AFRAME.registerComponent('revela-bajo-agua',{
    schema:{
      radius:{default:0.3},          // radio de la imagen (1 = ancho de la página)
      depth:{default:0.03},          // profundidad bajo la superficie del agua
      after:{default:6},             // gotas antes de empezar a develarlo
      maxTime:{default:16},          // para entonces queda completo
      hold:{default:6},              // segundos que permanece develado
      vanish:{default:4},            // segundos que tarda en hundirse y disolverse
      rest:{default:4},              // pausa antes de que las gotas vuelvan a develarlo
      refract:{default:0.035},       // cuánto deforma el agua al pasar una onda
      tint:{default:HZC('#7FF3FF')},
      src:{default:''}               // imagen (PNG/WebP con transparencia) que aparece bajo el agua
    },
    init(){
      this.anchor=this.el.closest('[mindar-image-target],[hz-ancla]')||this.el;
      this.findRipple=()=>this.anchor.querySelector('[ripple-surface]')||(this.el.parentNode&&this.el.parentNode.querySelector('[ripple-surface]'))||document.querySelector('#ripple');
      this.t=0; this.running=false; this.seen=0; this.drops=0; this.clears=[]; this.built=false;
      this.M=256; this.mc=document.createElement('canvas'); this.mc.width=this.mc.height=this.M; this.mx=this.mc.getContext('2d');
      this.img=new Image(); if(this.data.src) this.img.src=hzSrc(this.data.src);
      this.anchor.addEventListener('targetFound',()=>this.start());
      this.anchor.addEventListener('targetLost',()=>{ clearTimeout(this._lostT); this._lostT=setTimeout(()=>this.reset(),2000); });
    },
    build(){
      const T=AFRAME.THREE,d=this.data; this.ripple=this.findRipple(); const rc=this.ripple&&this.ripple.components['ripple-surface'];
      if(!rc||!this.data.src||!this.img.complete||!this.img.naturalWidth) return false;
      const ru=rc.uniforms, W=rc.data.width;                                   // la imagen comparte el tiempo y las gotas de la onda
      this.maskTex=new T.CanvasTexture(this.mc);
      const tex=new T.Texture(this.img); tex.colorSpace=T.SRGBColorSpace; tex.needsUpdate=true;
      this.u={uMap:{value:tex},uMask:{value:this.maskTex},uAll:{value:0},uFade:{value:1},uTint:{value:new T.Color(d.tint)},uRef:{value:d.refract},
        uK:{value:(d.radius*2)/W},                                              // tamaño de la imagen en coordenadas de la onda
        iTime:ru.iTime,count:ru.count,centers:ru.centers,startT:ru.startT,speed:ru.speed,damp:ru.damp};
      const mat=new T.ShaderMaterial({uniforms:this.u,transparent:true,depthWrite:false,
        vertexShader:`varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          void main(){ vUv=uv; vec4 mv=modelViewMatrix*vec4(position,1.0); vN=normalize(normalMatrix*vec3(0.0,0.0,1.0)); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
        fragmentShader:`precision highp float; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
          uniform sampler2D uMap,uMask; uniform vec3 uTint; uniform float uAll,uFade,uRef,uK,iTime,speed,damp; uniform int count; uniform float centers[24]; uniform float startT[12];
          void main(){
            vec2 w=0.5+(vUv-0.5)*uK;                                             // posición en la superficie del agua
            vec2 off=vec2(0.0); float caus=0.0;
            for(int i=0;i<12;i++){ if(i>=count) break;
              vec2 c=vec2(centers[2*i],centers[2*i+1]); float dt=max(0.0,iTime-startT[i]); vec2 dv=w-c; float r=length(dv); float wv=r-speed*dt;
              float life=exp(-damp*dt*0.85); float prof=exp(-abs(wv)/0.02)*life;

      // en el mismo plano de la onda, un poco por debajo de la superficie
      this.group=new T.Group(); this.group.position.set(0,0,-d.depth);
      this.plane=new T.Mesh(new T.PlaneGeometry(d.radius*2,d.radius*2),mat); this.plane.renderOrder=5;
      // sombra suave: lo apoya en el fondo
      const S=128,sc=document.createElement('canvas'); sc.width=sc.height=S; const sx=sc.getContext('2d'); const g=sx.createRadialGradient(S/2,S/2,S*0.3,S/2,S/2,S/2); g.addColorStop(0,'rgba(0,0,0,0.55)'); g.addColorStop(1,'rgba(0,0,0,0)'); sx.fillStyle=g; sx.fillRect(0,0,S,S);

    },
    start(){
      clearTimeout(this._lostT); if(this.running) return;

      this._pending=false; this.running=true; this.cycle();
      this.group.visible=true;
    },
    cycle(){                                                                    // empieza (o reempieza) un ciclo: oculto bajo el agua
      this.t=0; this.drops=0; this.clears=[]; this.u.uAll.value=0; this.u.uFade.value=1; this.group.position.z=-this.data.depth;
      const rc=this.ripple.components['ripple-surface']; this.seen=rc?rc._head:0;
      this.mx.fillStyle='#000'; this.mx.fillRect(0,0,this.M,this.M); this.maskTex.needsUpdate=true;
    },
    reset(){ this.running=false; this._pending=false; if(this.group) this.group.visible=false; },
    tick(t,dt){
      if(!this.running){
        if(this._pending || (this.anchor.components&&this.anchor.components['mindar-image-target']&&this.anchor.object3D.visible)) this.start();
        if(!this.running) return; }
      const d=this.data, st=Math.min(0.05,(dt||16)/1000); this.t+=st;

          if(this.drops>d.after && this.clears.length<40){
            // el claro se abre exactamente donde cayó la gota
            const px=0.5+(u.centers.value[i*2]-0.5)*k, py=0.5+(u.centers.value[i*2+1]-0.5)*k;
            this.clears.push({x:px,y:1-py,t0:this.t,r:0.25+Math.random()*0.25}); } } }
      if(this.clears.length){ const x=this.mx, M=this.M; x.globalCompositeOperation='lighter';
        this.clears.forEach(c=>{ if(c.done) return; const q=Math.min(1,(this.t-c.t0)/2.4), e=1-Math.pow(1-q,3), R=Math.max(1,c.r*e*M);
          const g=x.createRadialGradient(c.x*M,c.y*M,0,c.x*M,c.y*M,R); g.addColorStop(0,'rgba(255,255,255,0.10)'); g.addColorStop(0.7,'rgba(255,255,255,0.06)'); g.addColorStop(1,'rgba(255,255,255,0)');
          x.fillStyle=g; x.beginPath(); x.arc(c.x*M,c.y*M,R,0,Math.PI*2); x.fill(); if(q>=1) c.done=true; });
        x.globalCompositeOperation='source-over'; this.maskTex.needsUpdate=true; }
      const g=Math.min(1,Math.max(0,(this.t-(d.maxTime-3))/3)); this.u.uAll.value=g*g*(3-2*g);
      // la sombra aparece a medida que se devela
      // develado completo → permanece → se hunde y se disuelve → pausa → vuelve a empezar
      const sm=x=>{ x=Math.min(1,Math.max(0,x)); return x*x*(3-2*x); };
      const v0=d.maxTime+d.hold, f=sm((this.t-v0)/d.vanish);
      this.u.uFade.value=1-f; this.group.position.z=-d.depth-f*0.05;
      const mean=Math.min(1,this.clears.filter(c=>c.done).length/8)*0.6+this.u.uAll.value*0.4; this.shadowMat.opacity=0.7*Math.max(mean,this.u.uAll.value)*(1-f);
      if(this.t>v0+d.vanish+d.rest) this.cycle();
    }
  });
  </script>

  <!-- APARICIÓN-BRUMA: pasado el tiempo de espera, una imagen emerge desde la bruma y la escena se entibia -->

    schema:{
      delay:{default:16},           // segundos antes de que aparezca
      emerge:{default:6},           // segundos que tarda en salir de la niebla
      width:{default:0.72},          // ancho de la imagen (1 = ancho de la página)
      z:{default:0.1},             // altura sobre la página, entre las capas de bruma
      parallax:{default:0.025},     // cuánto se desplaza al inclinar el celular

      gather:{default:5.0},         // segundos que tardan en dibujarla
      size:{default:0.0085},
      rainGold:{default:HZC('#F0C070')},   // color final de la lluvia
      fogGold:{default:HZC('#E2BC80')},    // color final de la bruma
      splashGold:{default:HZC('#F6D08A')}, // color final de las salpicaduras

      this.u={uMap:{value:null},uProg:{value:0},uTime:{value:0}};

        vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader:`precision highp float; varying vec2 vUv; uniform sampler2D uMap; uniform float uProg,uTime;
          float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
          float n(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }

            float reveal=smoothstep(0.0,0.35,uProg*1.45-(1.0-lum)*0.45-fog2*0.4);
            float a=border*reveal*c.a*(0.9+0.1*sin(uTime*0.6+fog*6.0));

            gl_FragColor=vec4(col,a);

      this.aspect=aspect; this.group=new T.Group(); this.group.position.z=d.z; this.group.visible=false; this.el.object3D.add(this.group);
      this.plane=new T.Mesh(new T.PlaneGeometry(d.width,d.width*aspect),mat); this.plane.renderOrder=994; this.group.add(this.plane);

    },
    // la figura en puntos: cada punto toma el color real de su lugar en la imagen; los luminosos llegan primero
    buildPoints(img){
      const T=AFRAME.THREE,d=this.data, W=256, H=Math.round(W*this.aspect), cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const x=cv.getContext('2d'); x.drawImage(img,0,0,W,H); const px=x.getImageData(0,0,W,H).data;

      const Lm=new Float32Array(W*H); for(let i=0;i<W*H;i++) Lm[i]=(0.3*px[i*4]+0.59*px[i*4+1]+0.11*px[i*4+2])/255;
      for(let y=1;y<H-1;y++) for(let xx=1;xx<W-1;xx++){ const j=y*W+xx, i=j*4, L=Lm[j];

        col.set([px[c[4]]/255,px[c[4]+1]/255,px[c[4]+2]/255],k*3);
        src.set([(Math.random()*2-1)*0.75,(Math.random()*2-1)*0.85,(Math.random()*0.35-0.1)],k*3);   // salen de toda la bruma
        tim[k]=(0.05+0.6*(1-c[3])+0.35*Math.random())*d.gather*0.55; rnd[k]=Math.random(); }
      const g=new T.BufferGeometry(); g.setAttribute('position',new T.BufferAttribute(tgt,3)); g.setAttribute('aSrc',new T.BufferAttribute(src,3));

      const S=64,c2=document.createElement('canvas'); c2.width=c2.height=S; const y2=c2.getContext('2d'); const gr=y2.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
      gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.35,'rgba(255,255,255,0.5)'); gr.addColorStop(1,'rgba(255,255,255,0)'); y2.fillStyle=gr; y2.fillRect(0,0,S,S);
      this.pu={uTime:{value:-1},uDur:{value:d.gather*0.45},uAlpha:{value:1},uSize:{value:d.size},uViewH:{value:800},uMap:{value:new T.CanvasTexture(c2)}};
      this.pts=new T.Points(g,new T.ShaderMaterial({uniforms:this.pu,transparent:true,depthWrite:false,blending:T.AdditiveBlending,
        vertexShader:`attribute vec3 aSrc; attribute vec3 aCol; attribute float aT; attribute float aRnd; uniform float uTime,uDur,uSize,uViewH; varying vec3 vC; varying float vA;
          void main(){ float k=clamp((uTime-aT)/uDur,0.0,1.0); float e=k*k*(3.0-2.0*k);

            gl_Position=projectionMatrix*mv; vC=mix(vec3(0.85,0.78,0.6),aCol*1.35,smoothstep(0.3,1.0,e)); vA=clamp((uTime-aT)/0.4,0.0,1.0)*(0.45+0.55*e); }`,
        fragmentShader:`precision mediump float; uniform sampler2D uMap; uniform float uAlpha; varying vec3 vC; varying float vA;
          void main(){ float a=texture2D(uMap,gl_PointCoord).a*vA*uAlpha; if(a<0.004) discard; gl_FragColor=vec4(vC*a,a); }`}));

    },

      if(this._cl) return this._cl; const T=AFRAME.THREE, q=n=>{ const el=this.anchor.querySelector('['+n+']')||(this.el.parentNode&&this.el.parentNode.querySelector('['+n+']')); return el&&el.components[n]; };

    start(){ clearTimeout(this._lostT); if(this.running) return; this.running=true; this.t=0; this.warm(0); this.u.uProg.value=0; this.group.visible=true; if(this.pu){ this.pu.uTime.value=-1; this.pu.uAlpha.value=1; } },
    reset(){ this.running=false; this.group.visible=false; this.u.uProg.value=0; this.warm(0); },
    tick(t,dt){
      if(!this.running){ if(this.anchor.components&&this.anchor.components['mindar-image-target']&&this.anchor.object3D.visible) this.start(); else return; }
      const d=this.data; this.t+=Math.min(0.05,(dt||16)/1000);

    }
  });
  </script>

  <!-- PLEXUS (RGB vivo + IDs) -->
  <script>
  AFRAME.registerComponent('plexus',{
    schema:{
      count:{default:180}, area:{default:1.2}, speed:{default:0.12},
      maxDist:{default:0.45}, maxConn:{default:4},
      thickness:{default:1.2}, opacity:{default:1.0},
      showIds:{default:true}, idSize:{default:0.028}, idColor:{default:HZC('#FFFFFF')},
      idOffsetX:{default:0.02}, idOffsetY:{default:0.02}, idOffsetZ:{default:0.0}
    },
    init(){
      const T=AFRAME.THREE,d=this.data,N=d.count,R=d.area;
      this.pos=new Float32Array(N*3); this.vel=new Float32Array(N*3);
      for(let i=0;i<N;i++){
        const r=R*Math.cbrt(Math.random()), phi=Math.acos(2*Math.random()-1), th=Math.random()*Math.PI*2;
        const x=r*Math.sin(phi)*Math.cos(th), y=r*Math.cos(phi)*0.6, z=r*Math.sin(phi)*Math.sin(th);
        this.pos.set([x,y,z],i*3);
        this.vel.set([(Math.random()-0.5)*d.speed,(Math.random()-0.5)*d.speed*0.6,(Math.random()-0.5)*d.speed],i*3);
      }
      // Paleta dorada: cada nodo recibe un matiz fijo de oro (claro, medio, profundo)
      const hexPalette=[HZC(0xB98222),HZC(0x94661A),HZC(0x6E4A10)];
      this.palette = hexPalette.map(h=>new T.Color(h));
      this.nodeCol=new Float32Array(N*3);
      for(let i=0;i<N;i++){ const c=this.palette[i%this.palette.length]; this.nodeCol.set([c.r,c.g,c.b],i*3); }
      const dotGeo=new T.BufferGeometry(); dotGeo.setAttribute('position',new T.BufferAttribute(this.pos,3));
      dotGeo.setAttribute('color',new T.BufferAttribute(this.nodeCol,3));
      const dotMat=new T.PointsMaterial({size:3.0,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:0.9,depthTest:false,depthWrite:false});
      this.dots=new T.Points(dotGeo,dotMat); this.dots.renderOrder=999;

      const MAX_SEG=N*d.maxConn;
      this.linePositions=new Float32Array(MAX_SEG*2*3);
      this.lineColors   =new Float32Array(MAX_SEG*2*3);
      const lineGeo=new T.BufferGeometry();
      lineGeo.setAttribute('position',new T.BufferAttribute(this.linePositions,3));
      lineGeo.setAttribute('color',   new T.BufferAttribute(this.lineColors,3));
      lineGeo.setDrawRange(0,0);


      const lineMat=new T.LineBasicMaterial({vertexColors:true, transparent:true, opacity:d.opacity, depthTest:false, depthWrite:false});
      lineMat.blending = T.AdditiveBlending;

      this.lines=new T.LineSegments(lineGeo,lineMat); this.lines.renderOrder=1000;

      this.labelsGrp=new T.Group(); this.labels=[];
      if(d.showIds){
        for(let i=0;i<N;i++){
          const size=128, c=document.createElement('canvas'); c.width=size; c.height=size; const ctx=c.getContext('2d');
          ctx.clearRect(0,0,size,size); ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.font='700 64px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
          ctx.lineWidth=6; ctx.strokeStyle='rgba(0,0,0,0.65)'; ctx.strokeText(String(i+1), size/2, size/2);
          ctx.fillStyle=d.idColor; ctx.fillText(String(i+1), size/2, size/2);
          const tex=new T.CanvasTexture(c); tex.needsUpdate=true;
          const mat=new T.SpriteMaterial({map:tex, transparent:true, depthTest:false, depthWrite:false, opacity:0.95, blending:T.AdditiveBlending});
          const spr=new T.Sprite(mat); spr.scale.set(d.idSize,d.idSize,d.idSize);
          this.labelsGrp.add(spr); this.labels.push(spr);
        }
        this.labelsGrp.renderOrder=1001;
      }

      this.grp=new T.Group(); this.grp.add(this.dots, this.lines, this.labelsGrp);
      this.el.object3D.add(this.grp);
      this.clock=new T.Clock();
    },
    tick(){
      const d=this.data,dt=Math.min(0.033,this.clock.getDelta());
      const N=d.count,R=d.area,P=this.pos,V=this.vel;

      for(let i=0;i<N;i++){
        const i3=i*3;
        P[i3]+=V[i3]*dt; P[i3+1]+=V[i3+1]*dt; P[i3+2]+=V[i3+2]*dt;
        const m=Math.max(0,(Math.hypot(P[i3],P[i3+2])*1.0+Math.abs(P[i3+1])*1.4)-R);
        if(m>0){ V[i3]-=P[i3]*m*0.6*dt; V[i3+1]-=P[i3+1]*m*0.6*dt; V[i3+2]-=P[i3+2]*m*0.6*dt; }
      }
      this.dots.geometry.attributes.position.needsUpdate=true;

      const maxDist2=d.maxDist*d.maxDist; let segCount=0;
      const conn=new Uint16Array(N); const L=this.linePositions, C=this.lineColors;

      for(let i=0;i<N;i++){
        if(conn[i]>=d.maxConn) continue;
        const i3=i*3;
        for(let j=i+1;j<N;j++){
          if(conn[i]>=d.maxConn && conn[j]>=d.maxConn) break;
          const j3=j*3, dx=P[i3]-P[j3], dy=P[i3+1]-P[j3+1], dz=P[i3+2]-P[j3+2];
          if(dx*dx+dy*dy+dz*dz<=maxDist2){
            const o=segCount*6;
            L[o]=P[i3]; L[o+1]=P[i3+1]; L[o+2]=P[i3+2];
            L[o+3]=P[j3]; L[o+4]=P[j3+1]; L[o+5]=P[j3+2];
            const NC=this.nodeCol;   // degradé entre el color fijo de cada extremo (sin titileo)
            C[o]=NC[i3]; C[o+1]=NC[i3+1]; C[o+2]=NC[i3+2];
            C[o+3]=NC[j3]; C[o+4]=NC[j3+1]; C[o+5]=NC[j3+2];
            segCount++; conn[i]++; conn[j]++;
            if(segCount*6>=L.length) break;
          }
        }
        if(segCount*6>=L.length) break;
      }
      const geo=this.lines.geometry;
      geo.attributes.position.needsUpdate=true;
      geo.attributes.color.needsUpdate=true;
      geo.setDrawRange(0, segCount*2);

      if(d.showIds){
        const ox=d.idOffsetX, oy=d.idOffsetY, oz=d.idOffsetZ;
        for(let i=0;i<N;i++){
          const i3=i*3, sp=this.labels[i];
          if(sp) sp.position.set(P[i3]+ox, P[i3+1]+oy, P[i3+2]+oz);
        }
      }
    }
  });
  </script>
