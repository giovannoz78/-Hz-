  <!-- TEXTO por letras (neón) + EXPLOSIÓN DE PARTÍCULAS (a los 3s) -->
  <script>
  AFRAME.registerComponent('canvas-letters-rise',{
    schema:{
      text:{default:'[Hz]'}, color:{default:HZC('#FFFFFF')}, font:{default:'900 120px sans-serif'},
      gap:{default:0.16}, size:{default:0.55},
      rise:{default:1.3}, dur:{default:2600}, delayMax:{default:1800},
      neon:{default:true}, neonColor:{default:HZC('#CFA15D')}, neonGlow:{default:56},
      trail:{default:true}, trailEvery:{default:80}, trailLife:{default:800}, trailOpacity:{default:0.40}, trailRiseSpeed:{default:0.42},
      startFromBottom:{default:0.78},
      explodeDelay:{default:3000},
      particlesPerChar:{default:140},
      particleSize:{default:10}, particleSpeed:{default:0.85}, particleSpread:{default:0.22}, particleLife:{default:1600}, gravity:{default:-1.20}, drag:{default:0.985}
    },
    init(){
      const T=AFRAME.THREE,d=this.data; this.letters=[]; this._ghosts=[]; this.clock=new T.Clock();
      this._state='idle'; this._explGroups=[]; this._explodeAt=null;
      const chars=[...d.text.toUpperCase()], n=chars.length, startX=-((n-1)*d.gap)/2, baseY=-d.startFromBottom;

      const makeTex=(ch)=>{ const W=512,H=512,c=document.createElement('canvas'); c.width=W; c.height=H;
        const x=c.getContext('2d');
        x.clearRect(0,0,W,H);
        x.textAlign='center'; x.textBaseline='middle';
        x.font=d.font;
        if(d.neon){ x.shadowColor=d.neonColor; x.shadowBlur=d.neonGlow; x.fillStyle=d.neonColor; x.fillText(ch,W/2,H/2); x.shadowBlur=Math.max(8,d.neonGlow*0.35); x.fillText(ch,W/2,H/2); }
        x.shadowBlur=0; x.fillStyle=d.color; x.fillText(ch,W/2,H/2);
        const tex=new T.CanvasTexture(c);
        tex.colorSpace=T.SRGBColorSpace; tex.premultiplyAlpha=true; tex.generateMipmaps=false; tex.minFilter=T.LinearFilter; tex.magFilter=T.LinearFilter; tex.needsUpdate=true; return tex;
      };

      for(let i=0;i<n;i++){
        const ch=chars[i];
        const wrapper=document.createElement('a-entity');
        wrapper.object3D.position.set(startX+i*d.gap, baseY, 0);
        wrapper.object3D.scale.set(d.size,d.size,d.size);
        if(ch!==' '){
          const geo=new T.PlaneGeometry(1,1);
          const mat=new T.MeshBasicMaterial({map:makeTex(ch),transparent:true,side:T.DoubleSide,alphaTest:0.05});
          mat.depthTest=false; mat.depthWrite=false; mat.toneMapped=false;
          const mesh=new T.Mesh(geo,mat); mesh.renderOrder=10000;
          wrapper.object3D.add(mesh);
        }else{
          wrapper.setAttribute('visible','false');
        }
        this.el.appendChild(wrapper); this.letters.push(wrapper);
      }

      const s=64, can=document.createElement('canvas'); can.width=can.height=s;
      const ctx=can.getContext('2d'); const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
      g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.5,'rgba(255,255,255,0.6)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
      this._particleTex=new T.CanvasTexture(can);
      this._particleTex.colorSpace = T.SRGBColorSpace;
      this._particleTex.premultiplyAlpha = true;
      this._particleTex.generateMipmaps = false;
      this._particleTex.minFilter = T.LinearFilter;
      this._particleTex.magFilter = T.LinearFilter;
      this._particleTex.needsUpdate=true;
    },
    _spawnGhost(from){
      const T=AFRAME.THREE,d=this.data; const src=from.object3D.children[0]; if(!src) return;
      const geo=src.geometry; const mat=src.material.clone(); mat.transparent=true; mat.depthTest=false; mat.depthWrite=false; mat.blending=T.AdditiveBlending; mat.opacity=d.trailOpacity; mat.toneMapped=false;
      const ghost=new T.Mesh(geo,mat); ghost.renderOrder=9999; const wpos=new T.Vector3(); from.object3D.getWorldPosition(wpos); this.el.object3D.worldToLocal(wpos); ghost.position.copy(wpos);
      this.el.object3D.add(ghost); this._ghosts.push({m:ghost,t:0,life:d.trailLife/1000});
    },
    start(){
      const d=this.data;
      this.reset();
      this._state='rise';
      this._explodeAt = performance.now() + d.explodeDelay;

      this.letters.forEach((e)=>{
        const p=e.object3D.position;
        const delay=Math.random()*d.delayMax;
        e.setAttribute('animation__rise',{
          property:'position',
          to:`${p.x} ${p.y + d.rise} ${p.z}`,
          dur:d.dur, delay, easing:'easeOutCubic'
        });
        if(d.trail){
          const startAt=delay, endAt=delay+d.dur;
          setTimeout(()=>{ e._trailInt=setInterval(()=>this._spawnGhost(e),d.trailEvery); }, startAt);
          setTimeout(()=>{ clearInterval(e._trailInt); e._trailInt=null; }, endAt+60);
        }
      });

      this.clock.getDelta();
    },
    _explode(){
      const T=AFRAME.THREE, d=this.data;
      this._state='explode';
      for(const e of this.letters){
        const mesh=e.object3D.children[0];
        if(mesh) mesh.visible=false;
        const Np=d.particlesPerChar;
        const pos=new Float32Array(Np*3);
        const vel=new Float32Array(Np*3);
        const base=e.object3D.position.clone();
        for(let i=0;i<Np;i++){
          const a=Math.random()*Math.PI*2;
          const r=d.particleSpread*Math.sqrt(Math.random());
          const px = base.x + Math.cos(a)*r;
          const py = base.y + (Math.random()-0.5)*d.particleSpread*0.7;
          const pz = base.z + Math.sin(a)*r;
          pos[3*i]=px; pos[3*i+1]=py; pos[3*i+2]=pz;
          const sp = d.particleSpeed*(0.6+0.8*Math.random());
          vel[3*i]  = Math.cos(a)*sp*(0.8+0.4*Math.random());
          vel[3*i+1]= (0.35+Math.random()*0.6)*sp;
          vel[3*i+2]= Math.sin(a)*sp*(0.8+0.4*Math.random());
        }
        const geo=new T.BufferGeometry();
        geo.setAttribute('position', new T.BufferAttribute(pos,3));
        const mat=new T.PointsMaterial({
          map:this._particleTex, size:d.particleSize, sizeAttenuation:false,
          transparent:true, opacity:1.0, depthTest:false, depthWrite:false, blending:T.AdditiveBlending
        });
        mat.toneMapped=false;
        const points=new T.Points(geo,mat);
        points.renderOrder=10050;
        this.el.object3D.add(points);
        this._explGroups.push({points,pos,vel,born:performance.now(),life:d.particleLife});
      }
    },
    _updateExplosion(now, dt){
      const d=this.data;
      for(let i=this._explGroups.length-1;i>=0;i--){
        const g=this._explGroups[i];
        const t = now - g.born;
        const k = Math.min(1, t / g.life);
        const P=g.pos, V=g.vel, n=P.length/3;
        for(let j=0;j<n;j++){
          const j3=j*3;
          V[j3]   *= d.drag;
          V[j3+1]  = (V[j3+1] + d.gravity*dt) * d.drag;
          V[j3+2] *= d.drag;
          P[j3]   += V[j3]*dt;
          P[j3+1] += V[j3+1]*dt;
          P[j3+2] += V[j3+2]*dt;
        }
        g.points.geometry.attributes.position.needsUpdate=true;
        g.points.material.opacity = 1.0 - k;
        if(k>=1){
          this.el.object3D.remove(g.points);
          g.points.geometry.dispose(); g.points.material.dispose();
          this._explGroups.splice(i,1);
        }
      }
      if(this._explGroups.length===0) this._state='done';
    },
    tick(){
      const dt=this.clock.getDelta();
      if(this._state==='rise' && this._explodeAt && performance.now() >= this._explodeAt){
        this._explode();
        this._explodeAt = null;
      }
      for(let i=this._ghosts.length-1;i>=0;i--){
        const g=this._ghosts[i], d=this.data;
        g.t+=dt; const k=g.t/(d.trailLife/1000);
        if(g.m.material) g.m.material.opacity=d.trailOpacity*(1-Math.min(1,k));
        g.m.position.y+=d.trailRiseSpeed*dt;
        if(k>=1){ this.el.object3D.remove(g.m); this._ghosts.splice(i,1); }
      }
      if(this._state==='explode' && this._explGroups.length>0){
        this._updateExplosion(performance.now(), dt);
      }
    },
    reset(){
      const d=this.data,n=this.letters.length,startX=-((n-1)*d.gap)/2,baseY=-d.startFromBottom;
      this._state='idle';
      this._explodeAt=null;
      this.letters.forEach((e,i)=>{
        e.removeAttribute('animation__rise');
        if(e._trailInt) clearInterval(e._trailInt);
        e.object3D.position.set(startX+i*d.gap,baseY,0);
        const mesh=e.object3D.children[0]; if(mesh) mesh.visible=true;
      });
      this._ghosts.forEach(g=>this.el.object3D.remove(g.m)); this._ghosts.length=0;
      if(this._explGroups){
        this._explGroups.forEach(g=>{
          this.el.object3D.remove(g.points);
          g.points.geometry.dispose(); g.points.material.dispose();
        });
        this._explGroups.length=0;
      }
    }
  });
  </script>

  <!-- HEARTBEAT PULSE -->
  <script>
  AFRAME.registerComponent('heartbeat-pulse',{
    schema:{period:{default:1600},gap:{default:180},radius:{default:1.35},softness:{default:0.6},intensity:{default:0.9},colorInner:{default:HZC('#FFE0B3')},colorOuter:{default:HZC('#FF9A4D')}},
    init(){
      const T=AFRAME.THREE, geo=new T.PlaneGeometry(2,2);
      const vert=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
      const frag=`precision highp float; varying vec2 vUv; uniform float uTime,uPeriod,uGap,uRadius,uSoft,uIntensity; uniform vec3 uC1,uC2;
      float beat(float t){ float x=mod(t,uPeriod)/uPeriod, g=uGap/uPeriod; float p1=exp(-pow((x-0.02)/0.06,2.0)); float p2=exp(-pow((x-g)/0.06,2.0)); return clamp(p1+0.85*p2,0.0,1.5); }
      void main(){ vec2 p=vUv-0.5; float r=length(p)*2.0; float b=beat(uTime); float R=mix(0.15,uRadius,b); float edge=smoothstep(R,R-uSoft,r);
        vec3 col=mix(uC1,uC2,clamp(r/R,0.0,1.0)); float ring=(1.0-edge)*uIntensity*(0.7+0.3*b); gl_FragColor=vec4(col*ring, ring); }`;
      this.uniforms={uTime:{value:0},uPeriod:{value:this.data.period},uGap:{value:this.data.gap},uRadius:{value:this.data.radius},uSoft:{value:this.data.softness},uIntensity:{value:this.data.intensity},uC1:{value:new T.Color(this.data.colorInner)},uC2:{value:new T.Color(this.data.colorOuter)}};
      const mat=new T.ShaderMaterial({uniforms:this.uniforms,vertexShader:vert,fragmentShader:frag,transparent:true,depthTest:false,depthWrite:false,blending:T.AdditiveBlending});
      this.mesh=new T.Mesh(geo,mat); this.mesh.renderOrder=10000; this.mesh.position.set(0,0,-0.1); this.mesh.scale.set(10,10,10);
      const setup=()=>{const camEl=this.el.sceneEl.cameraEl||this.el.sceneEl.querySelector('a-camera'); if(camEl&&camEl.object3D){camEl.object3D.add(this.mesh); this.clock=new T.Clock();} else {this.el.sceneEl.addEventListener('loaded',()=>{const camEl2=this.el.sceneEl.cameraEl||this.el.sceneEl.querySelector('a-camera'); camEl2&&camEl2.object3D&&camEl2.object3D.add(this.mesh); this.clock=new T.Clock();},{once:true});}};
      if(this.el.sceneEl.hasLoaded) setup(); else this.el.sceneEl.addEventListener('loaded',setup,{once:true});
    },
    tick(){ if(!this.clock) return; this.uniforms.uTime.value += this.clock.getDelta()*1000.0; },
    remove(){ if(this.mesh&&this.mesh.parent) this.mesh.parent.remove(this.mesh); if(this.mesh){this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.mesh=null;} }
  });
  </script>

  <!-- ADN -->
  <script>
  AFRAME.registerComponent('dna-helix', {
    schema: {segments:{type:'int',default:170}, radius:{type:'number',default:0.12}, pitch:{type:'number',default:0.035}, freq:{type:'number',default:0.38}, speed:{type:'number',default:0.7}, bead:{type:'number',default:0.012}, rung:{type:'number',default:0.004}, glow:{type:'number',default:0.7}, halo:{type:'number',default:0.8}, haloSize:{type:'number',default:0.07}, aura:{type:'number',default:0.35}, haloColor:{default:HZC('#FFC870')}, ring:{type:'number',default:0}, tilt:{type:'number',default:18}, spin:{type:'number',default:0.12}, riseH:{type:'number',default:1.3}, riseFrom:{type:'number',default:-1.0}},   // ring>0: la hélice se curva en una aureola de ese radio
    init: function () {
      const el=this.el, THREE=AFRAME.THREE, d=this.data;
      this.reveal=1;   // 0..1: cuánto de la hélice está visible (lo maneja 'genesis')
      this.group=new THREE.Group(); el.setObject3D('dna', this.group);
      // ADN en dorado: cuatro matices de oro para las bases (A, T, C, G)
      const matA=new THREE.MeshStandardMaterial({color:HZC(0xE8B95A), metalness:0.6, roughness:0.35, emissive:HZC(0x8A5A12), emissiveIntensity:d.glow});
      const matT=new THREE.MeshStandardMaterial({color:HZC(0xF5D894), metalness:0.6, roughness:0.35, emissive:HZC(0x9C7426), emissiveIntensity:d.glow});
      const matC=new THREE.MeshStandardMaterial({color:HZC(0xB7802A), metalness:0.6, roughness:0.35, emissive:HZC(0x6B420C), emissiveIntensity:d.glow});
      const matG=new THREE.MeshStandardMaterial({color:HZC(0xD9A441), metalness:0.6, roughness:0.35, emissive:HZC(0x7E5414), emissiveIntensity:d.glow});
      const mats={A:matA,T:matT,C:matC,G:matG};
      const beadGeo=new THREE.SphereGeometry(d.bead,16,16);
      const rungMat=new THREE.MeshStandardMaterial({color:HZC(0xC9A25E), metalness:0.5, roughness:0.4, emissive:HZC(0x5E4214), emissiveIntensity:0.6});
      const railMat=new THREE.MeshStandardMaterial({color:HZC(0x9C7430), metalness:0.6, roughness:0.4, emissive:HZC(0x4A320C), emissiveIntensity:0.5});
      const compl=b=>({A:'T',T:'A',C:'G',G:'C'}[b]||'C');
      const randBase=()=> (Math.random()<0.5?(Math.random()<0.5?'A':'T'):(Math.random()<0.5?'C':'G'));
      this.leftBeads=[]; this.rightBeads=[]; this.rungs=[]; this.leftPath=new THREE.Group(); this.rightPath=new THREE.Group();
      this.group.add(this.leftPath,this.rightPath);
      const railRadius=d.rung*0.7; this.phase=0; const H=d.segments*d.pitch;
      if(d.ring>0){ this.leftPath.add(new THREE.Mesh(new THREE.CylinderGeometry(railRadius,railRadius,1,10),railMat)); this.rightPath.add(new THREE.Mesh(new THREE.CylinderGeometry(railRadius,railRadius,1,10),railMat)); }   // tramo que cierra el anillo
      this.morph=1; this.spinA=0;   // morph: 0 = hélice recta que sube desde abajo, 1 = aureola (lo maneja 'genesis')
      for(let i=0;i<d.segments;i++){
        const y=(i/(d.segments-1)-0.5)*H;
        const baseL=randBase(), baseR=compl(baseL);
        const beadL=new THREE.Mesh(beadGeo,mats[baseL]);
        const beadR=new THREE.Mesh(new THREE.SphereGeometry(d.bead,16,16),mats[baseR]);
        this.group.add(beadL,beadR); this.leftBeads.push(beadL); this.rightBeads.push(beadR);
        const rungGeo=new THREE.CylinderGeometry(d.rung,d.rung,1,12);
        const rung=new THREE.Mesh(rungGeo,rungMat);
        this.group.add(rung); this.rungs.push(rung);
        if(i>0){
          const segGeoL=new THREE.CylinderGeometry(railRadius,railRadius,1,10);
          const segGeoR=new THREE.CylinderGeometry(railRadius,railRadius,1,10);
          const segL=new THREE.Mesh(segGeoL,railMat);
          const segR=new THREE.Mesh(segGeoR,railMat);
          this.leftPath.add(segL); this.rightPath.add(segR);
        }
      }
      // ---- RESPLANDOR: halo suave en cada base + aura dorada detrás de la hélice ----
      const S=64, cv=document.createElement('canvas'); cv.width=cv.height=S; const cx=cv.getContext('2d');
      const gr=cx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
      gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.3,'rgba(255,255,255,0.45)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      cx.fillStyle=gr; cx.fillRect(0,0,S,S);
      const glowTex=new THREE.CanvasTexture(cv);
      const NB=d.segments*2;
      this.haloPos=new Float32Array(NB*3);
      const hg=new THREE.BufferGeometry(); hg.setAttribute('position',new THREE.BufferAttribute(this.haloPos,3));
      this.haloU={uMap:{value:glowTex},uColor:{value:new THREE.Color(d.haloColor)},uStr:{value:d.halo},uSize:{value:d.haloSize},uViewH:{value:800}};
      const hm=new THREE.ShaderMaterial({uniforms:this.haloU,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
        vertexShader:`uniform float uSize,uViewH; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0);
          float sc=length(vec3(modelViewMatrix[0][0],modelViewMatrix[0][1],modelViewMatrix[0][2]));
          gl_PointSize=min(256.0, uSize*sc*projectionMatrix[1][1]*uViewH*0.5/max(1e-4,-mv.z)); gl_Position=projectionMatrix*mv; }`,
        fragmentShader:`uniform sampler2D uMap; uniform vec3 uColor; uniform float uStr;
          void main(){ float a=texture2D(uMap,gl_PointCoord).a*uStr; if(a<0.004) discard; gl_FragColor=vec4(uColor*a,a); }`});
      this.halo=new THREE.Points(hg,hm); this.halo.frustumCulled=false; this.halo.renderOrder=30; this.group.add(this.halo);
      if(d.aura>0){
        this.auraMat=new THREE.SpriteMaterial({map:glowTex,color:new THREE.Color(d.haloColor),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:d.aura});
        const au=new THREE.Sprite(this.auraMat); if(d.ring>0) au.scale.set(d.ring*2.7, d.ring*2.7, 1); else au.scale.set(d.radius*7, d.segments*d.pitch*1.15, 1); au.renderOrder=29;
        el.setObject3D('dnaAura', au);   // fuera del grupo: no gira, queda como resplandor de fondo
      }
    },
    updatePositions: function (t) {
      const THREE=AFRAME.THREE, d=this.data, H=d.segments*d.pitch;
      let prevL=null, prevR=null, idxRailL=0, idxRailR=0;
      for(let i=0;i<d.segments;i++){
        let L,R;
        if(d.ring>0){                                                           // aureola: el eje de la hélice es un círculo alrededor del cerebro
          const turns=Math.round(d.segments*d.freq/(Math.PI*2));
          const sg=Math.PI/2+i/d.segments*Math.PI*2, ang=i/d.segments*Math.PI*2*turns+t;    // empieza adelante del cerebro
          // anillo horizontal, como el de Saturno: rodea al cerebro a la altura de su ecuador
          const C=new THREE.Vector3(d.ring*Math.cos(sg), 0, d.ring*Math.sin(sg)), Nn=new THREE.Vector3(Math.cos(sg),0,Math.sin(sg)), B=new THREE.Vector3(0,1,0);
          const off=Nn.clone().multiplyScalar(Math.cos(ang)*d.radius).add(B.clone().multiplyScalar(Math.sin(ang)*d.radius));
          const Lr=C.clone().add(off), Rr=C.clone().sub(off);
          // hélice recta que sube desde abajo (mismo giro), para el nacimiento
          const ys=d.riseFrom+i/(d.segments-1)*d.riseH, offS=new THREE.Vector3(Math.cos(ang)*d.radius,0,Math.sin(ang)*d.radius);
          const Ls=new THREE.Vector3(0,ys,0).add(offS), Rs=new THREE.Vector3(0,ys,0).sub(offS);
          const m=this.morph, e=m*m*(3-2*m);
          // la curva se cierra desde la base: cada tramo se dobla con un leve retardo según su lugar
          const ei=Math.min(1,Math.max(0,e*1.35-(i/d.segments)*0.35));
          L=Ls.lerp(Lr,ei); R=Rs.lerp(Rr,ei);
        } else {
          const y=(i/(d.segments-1)-0.5)*H, ang=i*d.freq+t;
          L=new THREE.Vector3(d.radius*Math.cos(ang), y, d.radius*Math.sin(ang));
          R=new THREE.Vector3(d.radius*Math.cos(ang+Math.PI), y, d.radius*Math.sin(ang+Math.PI));
        }
        const beadL=this.leftBeads[i], beadR=this.rightBeads[i]; beadL.position.copy(L); beadR.position.copy(R);
        const vis=Math.min(1,Math.max(0,this.reveal*(d.segments+6)-i)/6);   // crece de abajo hacia arriba con borde suave
        beadL.visible=beadR.visible=vis>0.01; beadL.scale.setScalar(vis); beadR.scale.setScalar(vis);
        const rung=this.rungs[i], mid=new THREE.Vector3().addVectors(L,R).multiplyScalar(0.5);
        const dir=new THREE.Vector3().subVectors(R, L); const len=dir.length();
        rung.scale.set(vis, len*vis, vis); rung.position.copy(mid); rung.visible=vis>0.01;
        const quat=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
        rung.setRotationFromQuaternion(quat);

        if(i>0){
          const segL=this.leftPath.children[idxRailL++], segR=this.rightPath.children[idxRailR++];
          const midL=new THREE.Vector3().addVectors(prevL,L).multiplyScalar(0.5);
          const dirL=new THREE.Vector3().subVectors(L,prevL); const lenL=dirL.length();
          segL.scale.set(1, lenL, 1); segL.position.copy(midL); segL.visible=vis>0.01;
          segL.setRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dirL.clone().normalize()));

          const midR=new THREE.Vector3().addVectors(prevR,R).multiplyScalar(0.5);
          const dirR=new THREE.Vector3().subVectors(R,prevR); const lenR=dirR.length();
          segR.scale.set(1, lenR, 1); segR.position.copy(midR); segR.visible=vis>0.01;
          segR.setRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dirR.clone().normalize()));
        }

        if(d.ring>0 && i===d.segments-1){                                        // cierra el anillo uniendo el último tramo con el primero
          const L0=this.leftBeads[0].position, R0=this.rightBeads[0].position, v0=this.morph>0.98?Math.min(1,Math.max(0,this.reveal*(d.segments+6)-d.segments)/6):0;
          [[this.leftPath.children[idxRailL],L,L0],[this.rightPath.children[idxRailR],R,R0]].forEach(([sg2,a,b])=>{ if(!sg2) return; const m=new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5), dv=new THREE.Vector3().subVectors(b,a);
            sg2.scale.set(1,dv.length(),1); sg2.position.copy(m); sg2.visible=v0>0.01; sg2.setRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dv.normalize())); });
        }
        prevL=L; prevR=R;
        if(this.haloPos){ this.haloPos.set([L.x,L.y,L.z],i*6); this.haloPos.set([R.x,R.y,R.z],i*6+3); }
      }
    },
    tick: function (time, delta) {
      this.phase += (delta / 1000) * this.data.speed;
      this.updatePositions(this.phase);
      const s = 1.0 + 0.02 * Math.sin(this.phase * 0.8);
      this.group.scale.set(s, s, s);
      if(this.data.ring>0){ const m=this.morph; this.spinA+=(delta/1000)*this.data.spin*m; this.group.rotation.set(this.data.tilt*Math.PI/180*m,this.spinA,0);   // ya cerrado, el anillo se inclina hacia quien mira y gira lento alrededor del cerebro
        const au=this.el.getObject3D('dnaAura'); if(au){ const d=this.data; au.scale.set(d.radius*7+(d.ring*2.9-d.radius*7)*m, d.riseH*1.1+(d.ring*1.5-d.riseH*1.1)*m, 1); au.position.y=(d.riseFrom+d.riseH/2)*(1-m); } }
      else this.group.rotation.y += 0.005;
      if(this.halo){
        this.halo.geometry.attributes.position.needsUpdate=true;
        this.halo.geometry.setDrawRange(0, Math.floor(this.reveal*this.data.segments)*2);
        const r=this.el.sceneEl.renderer; if(r){ this.haloU.uViewH.value=r.getContext().drawingBufferHeight; }
        const k=1.0+0.25*Math.sin(this.phase*0.8);
        this.haloU.uStr.value=this.data.halo*k;
        if(this.auraMat) this.auraMat.opacity=this.data.aura*k*this.reveal;
      }
    }
  });
  </script>

  <!-- CHORAL-CHORD (acorde gregoriano) -->
  <script>
  AFRAME.registerComponent('choral-chord',{
    schema:{
      baseNote:{default:'D3'}, A4:{default:432}, gain:{default:0.22},
      attack:{default:0.8}, decay:{default:2.0}, sustain:{default:0.6}, release:{default:2.5},
      lpHz:{default:1800}, delayTime:{default:0.23}, feedback:{default:0.25}, detuneCents:{default:6}
    },
    init(){
      this.ctx=null; this.master=null; this.env=null; this.lp=null; this.delay=null; this.fb=null;
      this.voices=[]; this._armed=false;
      this._semi=[0,7,12,15,19];
      this._noteToHz=(name)=>{
        const A4=this.data.A4;
        const map={'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11};
        const m=name.match(/^([A-G][b#]?)(-?\d)$/); if(!m) return A4;
        const n=map[m[1]], oct=parseInt(m[2]); const midi=n + (oct+1)*12;
        const a4midi=9 + (4+1)*12;
        return A4 * Math.pow(2,(midi-a4midi)/12);
      };
      const unlock=async()=>{await this._ensure(); this._arm();};
      window.addEventListener('pointerdown',unlock,{once:true,passive:true});
      document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'){await this._ensure();}});
    },
    async _ensure(){ if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC(); } if(this.ctx.state!=='running'){ try{await this.ctx.resume();}catch(e){} } },
    _arm(){
      if(this._armed) return;
      const t=this.ctx.currentTime, d=this.data;
      this.master=this.ctx.createGain(); this.master.gain.setValueAtTime(0, t);
      this.env=this.ctx.createGain(); this.env.gain.setValueAtTime(0, t);
      this.lp=this.ctx.createBiquadFilter(); this.lp.type='lowpass'; this.lp.frequency.setValueAtTime(d.lpHz, t);
      this.delay=this.ctx.createDelay(2.0); this.delay.delayTime.setValueAtTime(d.delayTime,t);
      this.fb=this.ctx.createGain(); this.fb.gain.setValueAtTime(d.feedback,t);
      this.env.connect(this.lp); this.lp.connect(this.delay); this.lp.connect(this.master);
      this.delay.connect(this.fb); this.fb.connect(this.lp);
      this.master.connect(this.ctx.destination);
      const base=this._noteToHz(this.data.baseNote);
      const makeVoice=(hz)=>{
        const g=this.ctx.createGain(); g.gain.value=1.0; g.connect(this.env);
        const o1=this.ctx.createOscillator(); o1.type='sine'; o1.frequency.value=hz; o1.detune.value= -this.data.detuneCents;
        const o2=this.ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=hz; o2.detune.value= +this.data.detuneCents;
        o1.connect(g); o2.connect(g);
        o1.start(); o2.start();
        return {g,o1,o2};
      };
      this.voices=[];
      for(const s of this._semi){
        const hz= base*Math.pow(2,s/12);
        this.voices.push(makeVoice(hz));
      }
      this._armed=true;
    },
    async gateOn(){ await this._ensure(); if(!this._armed) this._arm();
      const t=this.ctx.currentTime, d=this.data;
      this.env.gain.cancelScheduledValues(t);
      this.master.gain.cancelScheduledValues(t);
      this.env.gain.setValueAtTime(0.0001,t);
      this.env.gain.linearRampToValueAtTime(d.gain, t + d.attack);
      this.env.gain.linearRampToValueAtTime(d.gain*d.sustain, t + d.attack + d.decay);
      this.master.gain.linearRampToValueAtTime(1.0, t + 0.2);
    },
    gateOff(){ /* ya no usamos para cortar al instante, queda por compatibilidad */ },
    stopNow(){
      try{
        const now=this.ctx?.currentTime||0;
        this.master?.gain?.cancelScheduledValues?.(now);
        this.env?.gain?.cancelScheduledValues?.(now);
        this.fb?.gain?.cancelScheduledValues?.(now);
        this.master?.gain?.setValueAtTime?.(0, now);
        this.env?.gain?.setValueAtTime?.(0.0001, now);
        this.fb?.gain?.setValueAtTime?.(0, now);
        this.voices.forEach(v=>{ try{v.o1.stop();v.o2.stop();}catch(e){} try{v.o1.disconnect();v.o2.disconnect();v.g.disconnect();}catch(e){} });
        this.voices=[];
        this.delay?.disconnect(); this.fb?.disconnect(); this.lp?.disconnect(); this.env?.disconnect(); this.master?.disconnect();
      }catch(e){}
      try{ this.ctx?.close?.(); }catch(e){}
      this.ctx=null; this._armed=false;
    }
  });
  </script>

  <!-- CHOIR-VOICE (coro “ah”) -->
  <script>
  AFRAME.registerComponent('choir-voice',{
    schema:{
      gain:{default:0.12}, attack:{default:1.4}, decay:{default:2.8},
      sustain:{default:0.7}, release:{default:3.6},
      vowel:{default:'ah'}, voices:{default:6}, detuneCents:{default:14},
      lfoRate:{default:0.22}, chorusMs:{default:24}, chorusDepth:{default:0.0035}
    },
    init(){
      this.ctx=null; this.master=null; this.env=null; this.bus=null; this.vox=[];
      this.lfo=null; this.lfoGain=null;
      this.bp1=null; this.bp2=null; this.bp3=null;
      this.delayL=null; this.delayR=null; this.split=null; this.merge=null;
      this.mod=null; this.modGain=null; this.chLFO=null; this.chGain=null;
      this._armed=false;
      const unlock=async()=>{await this._ensure(); this._arm();};
      window.addEventListener('pointerdown',unlock,{once:true,passive:true});
      document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'){await this._ensure();}});
    },
    _formants(v){
      if(v==='oh') return [[500,5],[800,5],[2700,6]];
      if(v==='oo') return [[350,6],[700,6],[2400,7]];
      return [[700,5],[1100,5],[2900,6]];
    },
    async _ensure(){ if(!this.ctx){ const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC(); } if(this.ctx.state!=='running'){ try{await this.ctx.resume();}catch(e){} } },
    _arm(){
      if(this._armed) return;
      const t=this.ctx.currentTime, d=this.data, ctx=this.ctx;
      this.master=ctx.createGain(); this.master.gain.setValueAtTime(1, t);
      this.env=ctx.createGain(); this.env.gain.setValueAtTime(0, t);
      this.bus=ctx.createGain(); this.bus.gain.setValueAtTime(1, t);
      const [f1,f2,f3]=this._formants(d.vowel);
      const mkBP=(f,q)=>{ const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q; return bp; };
      this.bp1=mkBP(f1[0], f1[1]); this.bp2=mkBP(f2[0], f2[1]); this.bp3=mkBP(f3[0], f3[1]);
      this.lfo=ctx.createOscillator(); this.lfo.type='sine'; this.lfo.frequency.value=d.lfoRate;
      this.lfoGain=ctx.createGain(); this.lfoGain.gain.value=8;
      this.delayL=ctx.createDelay(0.05); this.delayR=ctx.createDelay(0.05);
      this.delayL.delayTime.value = d.chorusMs/1000;
      this.delayR.delayTime.value = (d.chorusMs*1.35)/1000;
      this.split=ctx.createChannelSplitter(2);
      this.merge=ctx.createChannelMerger(2);
      this.env.connect(this.bp1); this.bp1.connect(this.bp2); this.bp2.connect(this.bp3);
      const preStereo=ctx.createGain(); this.bp3.connect(preStereo);
      const stereo=ctx.createGain(); preStereo.connect(stereo);
      stereo.connect(this.split);
      this.split.connect(this.delayL,0);
      this.split.connect(this.delayR,1);
      this.delayL.connect(this.merge,0,0);
      this.delayR.connect(this.merge,0,1);
      this.merge.connect(this.bus);
      this.bus.connect(this.master);
      this.master.connect(ctx.destination);
      const mkVoice=(cents)=>{
        const g=ctx.createGain(); g.gain.value=1; g.connect(this.env);
        const o1=ctx.createOscillator(); o1.type='sawtooth';
        const o2=ctx.createOscillator(); o2.type='triangle';
        o1.frequency.value=175; o2.frequency.value=175;
        o1.detune.value=cents; o2.detune.value=cents*0.6;
        this.lfo.connect(this.lfoGain);
        this.lfoGain.connect(o1.detune); this.lfoGain.connect(o2.detune);
        o1.connect(g); o2.connect(g);
        o1.start(); o2.start();
        return {g,o1,o2};
      };
      this.vox=[];
      const spread=this.data.detuneCents, n=this.data.voices;
      for(let i=0;i<n;i++){
        const c = (i-(n-1)/2)*(spread/(n-1||1));
        this.vox.push(mkVoice(c));
      }
      this.lfo.start();
      this.mod=ctx.createOscillator(); this.mod.type='sine'; this.mod.frequency.value=0.09; this.modGain=ctx.createGain(); this.modGain.gain.value=80; this.mod.connect(this.modGain); this.modGain.connect(this.bp1.frequency); this.mod.start();
      this.chLFO=ctx.createOscillator(); this.chLFO.type='sine'; this.chLFO.frequency.value=0.13; this.chGain=ctx.createGain(); this.chGain.gain.value=this.data.chorusDepth; this.chLFO.connect(this.chGain); this.chGain.connect(this.delayL.delayTime); this.chLFO.start();
      this._armed=true;
    },
    async gateOn(){ await this._ensure(); if(!this._armed) this._arm();
      const t=this.ctx.currentTime, d=this.data;
      this.env.gain.cancelScheduledValues(t);
      this.env.gain.setValueAtTime(0.0001,t);
      this.env.gain.linearRampToValueAtTime(d.gain, t + d.attack);
      this.env.gain.linearRampToValueAtTime(d.gain*d.sustain, t + d.attack + d.decay);
    },
    gateOff(){ /* dejamos para compatibilidad, no usamos si cortamos inmediato */ },
    stopNow(){
      try{
        const now=this.ctx?.currentTime||0;
        this.master?.gain?.cancelScheduledValues?.(now);
        this.env?.gain?.cancelScheduledValues?.(now);
        this.master?.gain?.setValueAtTime?.(0, now);
        this.env?.gain?.setValueAtTime?.(0.0001, now);
        this.vox.forEach(v=>{ try{v.o1.stop();v.o2.stop();}catch(e){} try{v.o1.disconnect();v.o2.disconnect();v.g.disconnect();}catch(e){} });
        this.vox=[];
        try{ this.lfo?.stop(); }catch(e){} this.lfo?.disconnect(); this.lfo=null;
        try{ this.mod?.stop(); }catch(e){} this.mod?.disconnect(); this.mod=null;
        try{ this.chLFO?.stop(); }catch(e){} this.chLFO?.disconnect(); this.chLFO=null;
        this.modGain?.disconnect(); this.chGain?.disconnect();
        this.delayL?.disconnect(); this.delayR?.disconnect();
        this.merge?.disconnect(); this.split?.disconnect();
        this.bp3?.disconnect(); this.bp2?.disconnect(); this.bp1?.disconnect();
        this.env?.disconnect(); this.bus?.disconnect(); this.master?.disconnect();
      }catch(e){}
      try{ this.ctx?.close?.(); }catch(e){}
      this.ctx=null;
      this._armed=false;
    }
  });
  </script>

<body>
  <!-- AGUJERO NEGRO: horizonte de sucesos, anillo de fotones, disco de acreción girando en espiral,
       la parte trasera del disco curvada por encima (lente gravitacional) y estrellas que caen en espiral. -->
  <script>
  AFRAME.registerComponent('hoyo-negro',{
    schema:{ radio:{default:0.06}, disco:{default:0.36}, z:{default:0.17}, inclina:{default:12}, estrellas:{default:1600}, seed:{default:9} },
    init(){
      const T=AFRAME.THREE,d=this.data;
      this.anchor=this.el.closest('[mindar-image-target],[hz-ancla]')||this.el;
      let sd=d.seed*48271+1; const rnd=()=>{ sd=(sd*48271)%2147483647; return sd/2147483647; };
      const LUZ={blending:T.CustomBlending,blendEquation:T.AddEquation,blendSrc:T.OneFactor,blendDst:T.OneFactor,blendSrcAlpha:T.ZeroFactor,blendDstAlpha:T.OneFactor};
      this.root=new T.Group(); this.root.position.z=d.z; this.root.visible=false; this.el.object3D.add(this.root);
      this.plano=new T.Group(); this.plano.rotation.x=d.inclina*Math.PI/180; this.root.add(this.plano);
      this.u={uTime:{value:0},uFade:{value:0},uRh:{value:d.radio},uRd:{value:d.disco}};
      const NOISE=`float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

        vertexShader:`varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,

  <!-- SINAPSIS: neuronas suspendidas sobre la página unidas por axones; un impulso viaja por la conexión,

  <script>
  AFRAME.registerComponent('sinapsis',{
    schema:{ neuronas:{default:22}, area:{default:0.38}, alto:{default:0.32}, viaje:{default:0.9}, seed:{default:21} },
    init(){
      const T=AFRAME.THREE,d=this.data;
      this.anchor=this.el.closest('[mindar-image-target],[hz-ancla]')||this.el;
      let sd=d.seed*16807+5; const rnd=this.rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
      this.root=new T.Group(); this.root.visible=false; this.el.object3D.add(this.root);
      const LUZ={blending:T.CustomBlending,blendEquation:T.AddEquation,blendSrc:T.OneFactor,blendDst:T.OneFactor,blendSrcAlpha:T.ZeroFactor,blendDstAlpha:T.OneFactor};
      // neuronas
      const N=d.neuronas; this.Nr=[];
      for(let i=0;i<N;i++){ let p,ok=false,k=0; while(!ok&&k++<80){ const a=rnd()*6.283, r=Math.sqrt(rnd())*d.area; p=new T.Vector3(Math.cos(a)*r,Math.sin(a)*r,0.05+rnd()*d.alto); ok=this.Nr.every(n=>n.p.distanceTo(p)>0.1); }
        this.Nr.push({p,fire:-99,refr:0}); }
      // conexiones: cada neurona con 2-3 cercanas; axón curvo y orgánico
      this.E=[]; const segs=[], sArr=[], eArr=[];
      for(let i=0;i<N;i++){ const near=this.Nr.map((n,j)=>({j,dd:n.p.distanceTo(this.Nr[i].p)})).filter(o=>o.j!==i).sort((a,b)=>a.dd-b.dd).slice(0,2+Math.floor(rnd()*2));
        for(const o of near){ if(this.E.length>=60) break; if(this.E.some(e=>e.a===o.j&&e.b===i)) continue;
          const A=this.Nr[i].p, B=this.Nr[o.j].p, mid=A.clone().lerp(B,0.5).add(new T.Vector3((rnd()-0.5)*0.08,(rnd()-0.5)*0.08,(rnd()-0.5)*0.06));
          const q1=A.clone().lerp(mid,0.5).add(new T.Vector3((rnd()-0.5)*0.03,(rnd()-0.5)*0.03,(rnd()-0.5)*0.03));
          const cur=new T.CatmullRomCurve3([A,q1,mid,B]); const P=cur.getPoints(40), id=this.E.length;
          for(let k=0;k<40;k++){ segs.push(P[k].x,P[k].y,P[k].z,P[k+1].x,P[k+1].y,P[k+1].z); sArr.push(k/40,(k+1)/40); eArr.push(id,id); }
          this.E.push({a:i,b:o.j,start:-99}); } }
      const g=new T.BufferGeometry(); g.setAttribute('position',new T.Float32BufferAttribute(segs,3)); g.setAttribute('aS',new T.Float32BufferAttribute(sArr,1)); g.setAttribute('aE',new T.Float32BufferAttribute(eArr,1));
      this.u={uTime:{value:0},uStart:{value:new Array(64).fill(-99)},uDur:{value:d.viaje},uFade:{value:0}};
      this.axones=new T.LineSegments(g,new T.ShaderMaterial(Object.assign({uniforms:this.u,transparent:true,depthWrite:false,
        vertexShader:`attribute float aS; attribute float aE; uniform float uStart[64]; uniform float uTime,uDur; varying float vP; varying float vS;
          void main(){ int e=int(aE+0.5); float st=0.0; for(int i=0;i<64;i++){ if(i==e){ st=uStart[i]; } }
            float x=(uTime-st)/uDur; vP=exp(-pow((aS-x)/0.06,2.0))*step(0.0,x)*step(x,1.1); vS=aS; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader:`precision mediump float; uniform float uFade; varying float vP; varying float vS; void main(){ float a=(0.38+2.2*vP)*uFade; gl_FragColor=vec4(vec3(a),0.0); }`},LUZ)));
      this.axones.frustumCulled=false; this.root.add(this.axones);
      // dendritas: ramitas cortas alrededor de cada soma
      const dd=[]; this.Nr.forEach(n=>{ for(let b=0;b<7;b++){ let p=n.p.clone(), dir=new T.Vector3(rnd()-0.5,rnd()-0.5,(rnd()-0.5)*0.6).normalize();
        for(let s=0;s<5;s++){ const q=p.clone().add(dir.clone().multiplyScalar(0.012+rnd()*0.01)); dd.push(p.x,p.y,p.z,q.x,q.y,q.z); p=q; dir.add(new T.Vector3((rnd()-0.5)*0.8,(rnd()-0.5)*0.8,(rnd()-0.5)*0.5)).normalize();
          if(rnd()<0.3){ const r2=q.clone().add(new T.Vector3(rnd()-0.5,rnd()-0.5,rnd()-0.5).normalize().multiplyScalar(0.015)); dd.push(q.x,q.y,q.z,r2.x,r2.y,r2.z); } } } });
      const dg=new T.BufferGeometry(); dg.setAttribute('position',new T.Float32BufferAttribute(dd,3));
      this.dmat=new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false,blending:T.AdditiveBlending});

      // somas, destellos de sinapsis y neurotransmisores
      const S=64,c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d'); const gr=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);

      const pg=new T.BufferGeometry(); pg.setAttribute('position',new T.BufferAttribute(this.pp,3)); pg.setAttribute('aL',new T.BufferAttribute(this.pl,1));
      this.pu={uMap:{value:tG},uViewH:{value:800}};
      this.trans=new T.Points(pg,new T.ShaderMaterial(Object.assign({uniforms:this.pu,transparent:true,depthWrite:false,
        vertexShader:`attribute float aL; uniform float uViewH; varying float vL; void main(){ vL=aL; vec4 mv=modelViewMatrix*vec4(position,1.0); float sc=length(vec3(modelViewMatrix[0][0],modelViewMatrix[0][1],modelViewMatrix[0][2]));
          gl_PointSize=aL>0.0?clamp(0.006*sc*projectionMatrix[1][1]*uViewH*0.5/max(1e-4,abs(mv.z)),1.0,10.0):0.0; gl_Position=projectionMatrix*mv; }`,
        fragmentShader:`precision mediump float; uniform sampler2D uMap; varying float vL; void main(){ if(vL<=0.0) discard; float a=texture2D(uMap,gl_PointCoord).a*min(1.0,vL*2.0); gl_FragColor=vec4(vec3(a),0.0); }`},LUZ)));
      this.trans.frustumCulled=false; this.root.add(this.trans);
      this.cola=[]; this.t=0; this.running=false; this.next=0.5;
      this.anchor.addEventListener('targetFound',()=>this.start());
      this.anchor.addEventListener('targetLost',()=>{ clearTimeout(this._lostT); this._lostT=setTimeout(()=>this.reset(),2000); });
    },
    start(){ clearTimeout(this._lostT); if(this.running) return; this.running=true; this.t=0; this.root.visible=true; this.u.uFade.value=0; this.next=0.8; this.cola=[]; this.u.uStart.value.fill(-99); },
    reset(){ this.running=false; this.root.visible=false; },
    dispara(i){ const n=this.Nr[i]; if(this.t-n.fire<0.9) return; n.fire=this.t;
      this.E.forEach((e,k)=>{ if(e.a===i){ this.u.uStart.value[k]=this.t; this.cola.push({k,at:this.t+this.data.viaje}); } }); },
    tick(t,dt){
      if(!this.running){ if(this.anchor.components&&this.anchor.components['mindar-image-target']&&this.anchor.object3D.visible) this.start(); if(!this.running) return; }
      const st=Math.min(0.05,(dt||16)/1000); this.t+=st; const s=this.t, rnd=this.rnd;
      this.u.uTime.value=s; this.u.uFade.value=Math.min(1,s/2); this.dmat.opacity=0.28*this.u.uFade.value;
      // disparos espontáneos de vez en cuando
      if(s>this.next){ this.dispara(Math.floor(rnd()*this.Nr.length)); this.next=s+1.2+rnd()*2.2; }
      // el impulso llega: destello en la sinapsis, neurotransmisores cruzando, la siguiente dispara

      const r=this.el.sceneEl.renderer; if(r) this.pu.uViewH.value=r.getContext().drawingBufferHeight;

  <!-- ESPELEOTEMAS: estalagmitas que suben desde la página o estalactitas que bajan de un techo invisible.
       Crecen por capas mientras cae el agua gota a gota; cada gota deja un destello o un anillo donde golpea. -->
  <script>
  AFRAME.registerComponent('espeleotema',{
    schema:{
      tipo:{default:'estalagmita'},  // 'estalagmita' (crece hacia arriba) o 'estalactita' (cuelga y crece hacia abajo)
      cantidad:{default:9},
      alto:{default:0.32},           // altura de la más grande (1 = ancho de la página)
      techo:{default:0.45},          // altura del techo del que cuelgan / desde donde caen las gotas
      area:{default:0.34},
      crece:{default:16},            // segundos que tardan en formarse
      queda:{default:8}, seed:{default:11}
    },
    init(){
      const T=AFRAME.THREE,d=this.data, arriba=d.tipo!=='estalactita';
      this.anchor=this.el.closest('[mindar-image-target],[hz-ancla]')||this.el;
      let sd=d.seed*69621+3; const rnd=()=>{ sd=(sd*69621)%2147483647; return sd/2147483647; };
      this.root=new T.Group(); this.root.visible=false; this.el.object3D.add(this.root);
      const mat=new T.MeshStandardMaterial({color:HZC('#b4b4b4'),roughness:0.7,metalness:0.0,emissive:HZC('#0c0c0c'),side:T.DoubleSide});
      this.F=[];
      for(let i=0;i<d.cantidad;i++){
        let x,y,ok=false,k=0; while(!ok&&k++<80){ const a=rnd()*6.283, r=Math.sqrt(rnd())*d.area; x=Math.cos(a)*r; y=Math.sin(a)*r; ok=this.F.every(f=>Math.hypot(f.x-x,f.y-y)>0.08); }
        const H=d.alto*(0.35+0.65*rnd()), R=H*(0.085+rnd()*0.05), ph=rnd()*6.283, pts=[new T.Vector2(0.0005,0)];
        // perfil: base ancha, punta fina, con anillos de crecimiento (capas de calcita)
        for(let j=0;j<=40;j++){ const t=j/40; const rr=R*Math.pow(1-t,1.35)*(1+0.07*Math.sin(t*46+ph)+0.04*Math.sin(t*17+ph*2))+(t<1?0.0015:0); pts.push(new T.Vector2(Math.max(0.0005,rr),t*H)); }
        const g=new T.LatheGeometry(pts,18); g.rotateX(Math.PI/2);            // eje Y → eje Z (perpendicular a la página)
        if(!arriba) g.rotateX(Math.PI);                                       // cuelga hacia abajo
        const p=g.attributes.position, bend=(rnd()-0.5)*0.4, dir=rnd()*6.283;  // leve inclinación, nunca perfectamente recta
        for(let v=0;v<p.count;v++){ const z=Math.abs(p.getZ(v))/H; p.setX(v,p.getX(v)+Math.cos(dir)*bend*z*z*H*0.3); p.setY(v,p.getY(v)+Math.sin(dir)*bend*z*z*H*0.3); }
        g.computeVertexNormals();
        const m=new T.Mesh(g,mat); m.position.set(x,y,arriba?0.002:d.techo); m.scale.set(0.001,0.001,0.001); this.root.add(m);
        this.F.push({x,y,H,m,t0:rnd()*d.crece*0.35,dur:d.crece*(0.55+rnd()*0.4),tip:new T.Vector3(x,y,0)});
      }
      // techo apenas sugerido para las estalactitas: un velo de roca que se disuelve en los bordes

        for(let i=0;i<500;i++){ const a=rnd()*6.283, r=Math.sqrt(rnd())*S*0.42, gr=x.createRadialGradient(S/2+Math.cos(a)*r,S/2+Math.sin(a)*r,0,S/2+Math.cos(a)*r,S/2+Math.sin(a)*r,8+rnd()*22);

  <!-- MERCURIO: gotas de metal líquido sobre la página que se atraen y se funden (campo de metaballs con reflejo de espejo);
       cada unión hace temblar la gota; al quedar una sola, estalla en gotitas y vuelve a empezar. -->
  <script>
  AFRAME.registerComponent('mercurio',{
    schema:{
      gotas:{default:14},          // gotas sueltas al empezar (máximo 16)
      area:{default:0.38},         // radio de la zona donde se reparten (1 = ancho de la página)
      tamano:{default:0.024},      // radio medio de cada gota
      atrae:{default:0.0008},       // fuerza con que se buscan
      queda:{default:5},           // segundos que permanece como una sola gota
      z:{default:0.012}, seed:{default:5}
    },
    init(){
      const T=AFRAME.THREE,d=this.data; this.MAX=16;
      this.anchor=this.el.closest('[mindar-image-target],[hz-ancla]')||this.el;
      let sd=d.seed*48271+7; this.rnd=()=>{ sd=(sd*48271)%2147483647; return sd/2147483647; };
      this.u={uD:{value:new Array(16).fill(0).map(()=>new T.Vector4())},uW:{value:new Array(16).fill(0).map(()=>new T.Vector2())},uN:{value:0},uTime:{value:0},uFade:{value:1}};
      const mat=new T.ShaderMaterial({uniforms:this.u,transparent:true,depthWrite:false,
        vertexShader:`varying vec2 vP; varying vec3 vV; varying mat3 vNM;
          void main(){ vP=position.xy; vec4 mv=modelViewMatrix*vec4(position,1.0); vV=normalize(-mv.xyz); vNM=normalMatrix; gl_Position=projectionMatrix*mv; }`,
        fragmentShader:`precision highp float; varying vec2 vP; varying vec3 vV; varying mat3 vNM;
          uniform vec4 uD[16]; uniform vec2 uW[16]; uniform int uN; uniform float uTime,uFade;
          // campo de las gotas: cada una suma r²/d²; donde supera 1 hay metal. uW = temblor (amplitud, fase) que deforma la gota en óvalo
          float campo(vec2 p){ float f=0.0;
            for(int i=0;i<16;i++){ if(i>=uN) break; vec2 q=p-uD[i].xy; float a=atan(q.y,q.x);
              float w=1.0+uW[i].x*cos(2.0*a+uW[i].y)+uW[i].x*0.5*cos(3.0*a-uW[i].y*1.3);
              float r=uD[i].z; f+=r*r/(dot(q,q)*w*w+1e-6); }
            return f; }
          float env(vec3 r){                                                        // estudio en blanco y negro: ventanas largas y un horizonte
            float v=0.08+0.12*smoothstep(-0.2,0.6,r.y);
            v+=0.95*smoothstep(0.06,0.0,abs(r.x-0.35))*smoothstep(-0.1,0.3,r.y);
            v+=0.7*smoothstep(0.05,0.0,abs(r.x+0.45))*smoothstep(0.0,0.5,r.y);
            v+=0.85*smoothstep(0.92,0.99,r.z)+0.5*smoothstep(0.035,0.0,abs(r.y-0.12));
            return v; }
          void main(){
            float f=campo(vP);
            float sombra=smoothstep(0.35,0.95,campo(vP-vec2(0.012,-0.012)))*0.45;     // sombra apoyada en la página

            float e=0.0015; float h=sqrt(clamp(1.0-1.0/f,0.0,1.0));
            float hx=sqrt(clamp(1.0-1.0/campo(vP+vec2(e,0.0)),0.0,1.0)), hy=sqrt(clamp(1.0-1.0/campo(vP+vec2(0.0,e)),0.0,1.0));

    start(){ clearTimeout(this._lostT); if(this.running) return; this.running=true; this.t=0; this.reparte(); this.u.uFade.value=0; this.mesh.visible=true; },
    reset(){ this.running=false; this.mesh.visible=false; },
    tick(t,dt){
      if(!this.running){ if(this.anchor.components&&this.anchor.components['mindar-image-target']&&this.anchor.object3D.visible) this.start(); if(!this.running) return; }
      const d=this.data, st=Math.min(0.05,(dt||16)/1000); this.t+=st; const G=this.G;
      this.u.uFade.value=Math.min(1,this.u.uFade.value+st*1.5);

          for(const b of G){ if(a===b) continue; const dx=b.x-a.x, dy=b.y-a.y, dd=Math.hypot(dx,dy)+1e-4, m=b.r*b.r/(a.r*a.r);
            const k=d.atrae*m/(dd*dd+0.004)*(dd<(a.r+b.r)*1.15?6:1); fx+=dx/dd*k; fy+=dy/dd*k; }
          a.vx=(a.vx+fx*st)*Math.pow(0.25,st); a.vy=(a.vy+fy*st)*Math.pow(0.25,st);
          const sp=Math.hypot(a.vx,a.vy), mx=0.12; if(sp>mx){ a.vx*=mx/sp; a.vy*=mx/sp; } }
        for(const a of G){ a.x+=a.vx*st; a.y+=a.vy*st; }

        for(let i=0;i<G.length;i++) for(let j=i+1;j<G.length;j++){ const a=G[i],b=G[j], dd=Math.hypot(a.x-b.x,a.y-b.y);
          if(dd<Math.min(a.r,b.r)*0.35){ const ma=a.r*a.r, mb=b.r*b.r, m=ma+mb;

            a.w=Math.min(0.32,a.w+0.12+0.25*mb/m); a.ph=Math.atan2(b.y-a.y,b.x-a.x)*2; G.splice(j,1); j--; } }

      } else {
        this.abreT+=st;

      this.u.uN.value=G.length; this.u.uTime.value=this.t;
    }
  });

  <script>

    init(){

        vertexShader:`attribute float aL; uniform float uSize,uViewH; varying float vL;

      // --- humo: puntos grises que suben y se abren ---
      const NH=160; this.NH=NH; this.hp=new Float32Array(NH*3); this.hr=new Float32Array(NH*2); for(let i=0;i<NH;i++){ this.hr[i*2]=rnd(); this.hr[i*2+1]=rnd(); }

    start(){ clearTimeout(this._lostT); if(this.running) return; this.running=true; this.t=0; this.lastHit=-1; this.root.visible=true; this.sl.fill(0); },

    chispazo(p){

      this.rA.rotation.z=-0.4+(0.2-dist)*1.5; this.rB.rotation.z=0.3-(0.2-dist)*1.2;
      const op=1-ret; [this.rA,this.rB].forEach(r=>{ r.material.transparent=op<1; r.material.opacity=op; r.visible=op>0.01; });
      if(hit){ const p=new AFRAME.THREE.Vector3(0,0,0.11); this.chispazo(p); this.flashMat.opacity=1; this.flash.position.copy(p); }
      this.flashMat.opacity*=Math.pow(0.002,st);

      const P=this.sp,V=this.sv,L=this.sl;
      for(let i=0;i<this.NS;i++){ if(L[i]<=0) continue; L[i]-=st;
        V[i*3+2]-=0.9*st; P[i*3]+=V[i*3]*st; P[i*3+1]+=V[i*3+1]*st; P[i*3+2]+=V[i*3+2]*st;

      this.fu.uHeat.value=brasa*(1-apaga*0.8); this.fu.uTime.value=s;
      this.brasaMat.opacity=brasa*(1-apaga)*fl*0.9; this.brasa.scale.setScalar(0.05+0.1*brasa*fl);
      this.lu.uTime.value=s; this.lu.uGrow.value=crece*(1-apaga)*(0.92+0.08*fl); this.llamaMesh.visible=this.lu.uGrow.value>0.01;
      this.luz.intensity=1.6*crece*(1-apaga)*fl;
      this.hu.uTime.value=s; this.hu.uOn.value=sm((s-prende-2)/3)*(1-sm((s-fin-1.5)/2.5));
      const r=this.el.sceneEl.renderer; if(r){ const hh=r.getContext().drawingBufferHeight; this.su.uViewH.value=hh; this.hu.uViewH.value=hh; }
      // la llama gira sobre el eje vertical de la página para mirar a la cámara
      const cam=this.el.sceneEl.camera; if(cam){ cam.getWorldPosition(this._cam); this.root.updateMatrixWorld(); this._inv.copy(this.root.matrixWorld).invert(); this._cam.applyMatrix4(this._inv);
        this.llamaMesh.rotation.set(0,0,Math.atan2(this._cam.y,this._cam.x)+Math.PI/2); }
      if(s>total){ this.t=0; this.lastHit=-1; }
    }
  });
  </script>

  <!-- MICELIO: hifas que nacen de unas esporas, crecen ramificándose sobre la página, se cruzan entre sí
       y después las recorren pulsos de luz, como nutrientes viajando por la red. Se marchita y vuelve a crecer. -->
  <script>
  AFRAME.registerComponent('micelio',{
    schema:{
      esporas:{default:5},          // puntos desde donde nace
      radio:{default:0.46},         // hasta dónde se extiende (1 = ancho de la página)
      crece:{default:14},           // segundos que tarda en cubrir la página
      paso:{default:0.005},         // largo de cada tramo de hifa
      rama:{default:0.085},         // probabilidad de ramificarse en cada tramo
      giro:{default:0.11},          // cuánto serpentea
      max:{default:26000},          // tramos máximos
      pulsoCada:{default:3.2},      // segundos entre pulsos de luz
      queda:{default:12},           // segundos que permanece formado antes de marchitarse
      marchita:{default:4},
      descanso:{default:2},
      color:{default:'#FFFFFF'}, opacidad:{default:0.85}, z:{default:0.006}, seed:{default:7}
    },
    init(){
      const T=AFRAME.THREE,d=this.data;
      this.anchor=this.el.closest('[mindar-image-target],[hz-ancla]')||this.el;
      let s=d.seed*9301+49297; const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
      // --- crecimiento: cada punta avanza serpenteando, a veces se divide; el tiempo de nacimiento sigue la distancia recorrida ---
      const P=[],Tm=[],Dd=[],tips=[],ends=[];
      for(let k=0;k<d.esporas;k++){
        const a=k*2.399+rnd()*0.6, r=k===0?rnd()*0.05:d.radio*(0.3+rnd()*0.35), x=Math.cos(a)*r, y=Math.sin(a)*r, n=6+Math.floor(rnd()*5);
        for(let j=0;j<n;j++) tips.push({x,y,dir:rnd()*Math.PI*2,t:rnd()*1.2,dist:0,v:0.75+rnd()*0.5,w:(rnd()-0.5)*0.08});
      }
      const vel=d.radio/(d.crece*0.8); const G=70, occ=new Uint8Array(G*G), cell=(x,y)=>Math.min(G-1,Math.max(0,Math.floor((x/d.radio*0.5+0.5)*G)))*G+Math.min(G-1,Math.max(0,Math.floor((y/d.radio*0.5+0.5)*G)));
      let seg=0;
      while(tips.length && seg<d.max){
        const nt=[];
        for(const p of tips){
          p.w+=(rnd()-0.5)*0.02; p.w*=0.85; p.dir+=p.w+(rnd()-0.5)*d.giro;     // serpentea con memoria, como una hifa
          const nx=p.x+Math.cos(p.dir)*d.paso, ny=p.y+Math.sin(p.dir)*d.paso;
          const rr=Math.hypot(nx,ny); if(rr>d.radio){ ends.push(p.x,p.y,p.t); continue; }
          const ci=cell(nx,ny); if(occ[ci]>=11 && p.dist>d.paso*6){ ends.push(p.x,p.y,p.t); continue; } if(occ[ci]<255) occ[ci]++;
          const dt=d.paso/(vel*p.v);
          P.push(p.x,p.y,nx,ny); Tm.push(p.t,p.t+dt); Dd.push(p.dist,p.dist+d.paso); seg++;
          p.x=nx; p.y=ny; p.t+=dt; p.dist+=d.paso;
          if(p.t>d.crece){ ends.push(p.x,p.y,p.t); continue; }
          nt.push(p);
          if(rnd()<d.rama*(rr<d.radio*0.85?1:0.4)) nt.push({x:nx,y:ny,dir:p.dir+(rnd()<0.5?-1:1)*(0.35+rnd()*0.5),t:p.t,dist:p.dist,v:p.v*(0.8+rnd()*0.35),w:0});
        }
        tips.length=0; tips.push(...nt);
      }
      tips.forEach(p=>ends.push(p.x,p.y,p.t));
      const N=Tm.length, pos=new Float32Array(N*3), aT=new Float32Array(N), aD=new Float32Array(N);
      let Dmax=0;
      for(let i=0;i<N;i++){ pos[i*3]=P[i*2]; pos[i*3+1]=P[i*2+1]; pos[i*3+2]=d.z+0.002*Math.sin(P[i*2]*40+P[i*2+1]*31); aT[i]=Tm[i]; aD[i]=Dd[i]; Dmax=Math.max(Dmax,Dd[i]); }
      const g=new T.BufferGeometry(); g.setAttribute('position',new T.BufferAttribute(pos,3)); g.setAttribute('aT',new T.BufferAttribute(aT,1)); g.setAttribute('aD',new T.BufferAttribute(aD,1));
      this.u={uTime:{value:0},uFade:{value:1},uPulse:{value:-1},uPulseK:{value:0},uDmax:{value:Dmax},uColor:{value:new T.Color(HZC(d.color))},uOp:{value:d.opacidad}};
      const LUZ={blending:T.CustomBlending,blendEquation:T.AddEquation,blendSrc:T.OneFactor,blendDst:T.OneFactor,blendSrcAlpha:T.ZeroFactor,blendDstAlpha:T.OneFactor};
      const mat=new T.ShaderMaterial(Object.assign({uniforms:this.u,transparent:true,depthWrite:false,
        vertexShader:`attribute float aT; attribute float aD; uniform float uTime; varying float vA; varying float vD; varying float vAge;
          void main(){ vAge=uTime-aT; vA=step(0.0,vAge); vD=aD; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader:`precision mediump float; uniform vec3 uColor; uniform float uOp,uFade,uPulse,uPulseK,uDmax; varying float vA; varying float vD; varying float vAge;
          void main(){ if(vA<0.5) discard;
            float joven=exp(-vAge*1.6);                                              // la hifa recién formada brilla más
            float p=exp(-pow((vD/uDmax-uPulse)/0.035,2.0))*uPulseK;                  // nutriente que viaja desde las esporas hacia las puntas
            float a=(0.22+0.8*joven+1.4*p)*uOp*uFade;
            gl_FragColor=vec4(uColor*a,0.0); }`},LUZ));
      this.lines=new T.LineSegments(g,mat); this.lines.frustumCulled=false; this.lines.renderOrder=50;
      // puntas: un punto de luz en cada extremo que avanza, y esporas que laten
      const M=ends.length/3, ep=new Float32Array(M*3), et=new Float32Array(M);
      for(let i=0;i<M;i++){ ep[i*3]=ends[i*3]; ep[i*3+1]=ends[i*3+1]; ep[i*3+2]=d.z+0.001; et[i]=ends[i*3+2]; }
      const pg=new T.BufferGeometry(); pg.setAttribute('position',new T.BufferAttribute(ep,3)); pg.setAttribute('aT',new T.BufferAttribute(et,1));
      const S=64,cv=document.createElement('canvas'); cv.width=cv.height=S; const x=cv.getContext('2d'); const gr=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
      gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.3,'rgba(255,255,255,0.4)'); gr.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=gr; x.fillRect(0,0,S,S);
      this.pu=Object.assign({uMap:{value:new T.CanvasTexture(cv)},uViewH:{value:800},uSize:{value:0.012}},this.u);
      const pm=new T.ShaderMaterial(Object.assign({uniforms:this.pu,transparent:true,depthWrite:false,
        vertexShader:`attribute float aT; uniform float uTime,uSize,uViewH; varying float vA;
          void main(){ float age=uTime-aT; vA=smoothstep(-0.6,0.0,age)*(0.35+0.65*exp(-max(age,0.0)*0.5));
            vec4 mv=modelViewMatrix*vec4(position,1.0); float sc=length(vec3(modelViewMatrix[0][0],modelViewMatrix[0][1],modelViewMatrix[0][2]));
            gl_PointSize=clamp(uSize*sc*projectionMatrix[1][1]*uViewH*0.5/max(1e-4,abs(mv.z)),1.0,24.0); gl_Position=projectionMatrix*mv; }`,
        fragmentShader:`precision mediump float; uniform sampler2D uMap; uniform vec3 uColor; uniform float uFade; varying float vA;
          void main(){ float a=texture2D(uMap,gl_PointCoord).a*vA*uFade; if(a<0.004) discard; gl_FragColor=vec4(uColor*a,0.0); }`},LUZ));
      // la punta se muestra mientras la hifa avanza: se ubica donde va el crecimiento (aproximación: el extremo final aparece al llegar)
      this.tipsPts=new T.Points(pg,pm); this.tipsPts.frustumCulled=false; this.tipsPts.renderOrder=51;
      this.group=new T.Group(); this.group.add(this.lines,this.tipsPts); this.group.visible=false; this.el.object3D.add(this.group);
      this.t=0; this.running=false;
      this.anchor.addEventListener('targetFound',()=>this.start());
      this.anchor.addEventListener('targetLost',()=>{ clearTimeout(this._lostT); this._lostT=setTimeout(()=>this.reset(),2000); });
    },
    start(){ clearTimeout(this._lostT); if(this.running) return; this.running=true; this.t=0; this.group.visible=true; },
    reset(){ this.running=false; this.group.visible=false; this.t=0; },
    tick(t,dt){
      if(!this.running){ if(this.anchor.components&&this.anchor.components['mindar-image-target']&&this.anchor.object3D.visible) this.start(); if(!this.running) return; }
      const d=this.data,u=this.u; this.t+=Math.min(0.05,(dt||16)/1000); const s=this.t;
      u.uTime.value=s;
      const r=this.el.sceneEl.renderer; if(r) this.pu.uViewH.value=r.getContext().drawingBufferHeight;
      // pulsos de nutrientes, cuando la red ya cubrió buena parte de la página
      const desde=d.crece*0.6;
      if(s>desde){ const q=((s-desde)%d.pulsoCada)/d.pulsoCada; u.uPulse.value=q*1.15-0.05; u.uPulseK.value=Math.sin(Math.PI*Math.min(1,q*1.1)); } else u.uPulseK.value=0;
      // permanece, se marchita, descansa y vuelve a crecer
      const fin=d.crece+d.queda, k=Math.min(1,Math.max(0,(s-fin)/d.marchita));
      u.uFade.value=1-k*k*(3-2*k);
      if(s>fin+d.marchita+d.descanso){ this.t=0; u.uFade.value=1; }
    }
  });
  </script>

      sinapsis:(e,i)=>({anchor:'', inner:marco(e,i,0.6)+'<a-entity sinapsis="'+esc(attr('sinapsis',e))+'"></a-entity>'}),
      // agujero negro · horizonte, anillo de fotones, disco de acreción y estrellas que caen
      'hoyo-negro':(e,i)=>({anchor:'', inner:marco(e,i,0.6)+'<a-entity hoyo-negro="'+esc(attr('hoyo-negro',e))+'"></a-entity>'}),
      // estalagmitas / estalactitas · crecen por capas mientras cae el agua gota a gota
      estalagmitas:(e,i)=>({anchor:'', inner:marco(e,i,0.6)+'<a-entity espeleotema="'+esc(attr('espeleotema',e,{tipo:'estalagmita'}))+'"></a-entity>'}),
      estalactitas:(e,i)=>({anchor:'', inner:marco(e,i,0.6)+'<a-entity espeleotema="'+esc(attr('espeleotema',e,{tipo:'estalactita'}))+'"></a-entity>'}),
      // mercurio · gotas de metal líquido que se atraen y se funden
      mercurio:(e,i)=>({anchor:'', inner:marco(e,i,0.6)+'<a-entity mercurio="'+esc(attr('mercurio',e))+'"></a-entity>'}),
      // fuego · dos pedernales chocan, saltan chispas, prende la yesca y crece la llama
      fuego:(e,i)=>({anchor:'', inner:marco(e,i,0.6)+'<a-entity fuego="'+esc(attr('fuego',e))+'"></a-entity>'}),
      // micelio · hifas que crecen ramificándose sobre la página y las recorren pulsos de luz
      micelio:(e,i)=>({anchor:'', inner:marco(e,i,0.55)+'<a-entity micelio="'+esc(attr('micelio',e))+'"></a-entity>'}),
      condensacion:(e,i,M)=>{
        const ex={}; if(e.foco){ const p=String(e.foco).trim().split(/\s+/).map(Number); ex.host=p.join(' '); ex.hostAuto=false; }
        if(e.vidrio!=null) ex.vidrio=e.vidrio; if(e.metal!=null) ex.metal=e.metal; if(e.respaldo) ex.respaldo=e.respaldo;
        return {anchor:'condensacion="'+esc(attr('condensacion',e,ex))+'"',
          inner:marco(e,i,0.55)+'<a-gltf-model src="#'+M+'" '+tr(e,'0 -0.45 0.04',0.85)+'></a-gltf-model>'};
      },
      // 1 · agua: gotas por inclinación; bajo la superficie, una imagen que las gotas van develando
      agua:(e,i)=>({anchor:'',
        inner:marco(e,i,0.7)+'<a-entity id="hz-ripple-'+i+'" class="hz-ripple" position="0 0 0.06" rotation="-90 0 0" ripple-surface="'+esc(attr('ripple-surface',e))+'" tilt-drops visible="false"></a-entity>'+
              (e.imagen?'<a-entity revela-bajo-agua="'+esc(attr('revela-bajo-agua',e,{src:e.imagen}))+'"></a-entity>':'')}),
      // 2 · red: la luz dibuja la malla en ondas circulares desde el centro; nodos y pulsos
      red:(e,i,M)=>{ const ex={}; if(e.malla) ex.mesh=e.malla; ex.cross=e.cruz||'';
        return {anchor:'', inner:marco(e,i)+'<a-gltf-model src="#'+M+'" '+tr(e)+' red-resplandor="'+esc(attr('red-resplandor',e,ex))+'" '+(e.girar===false?'':giro)+'></a-gltf-model>'}; },
      // 3 · lluvia y bruma; a los N segundos una imagen emerge de la niebla y la escena se entibia
      lluvia:(e,i,M)=>({anchor:'',
        inner:marco(e,i)+(M?'<a-gltf-model src="#'+M+'" '+tr(e)+'></a-gltf-model>':'')+
          '<a-entity><a-entity niebla-v2="'+esc(attr('niebla-v2',e))+'"></a-entity><a-entity lluvia-v2="'+esc(attr('lluvia-v2',e))+'"></a-entity><a-entity salpicaduras="'+esc(attr('salpicaduras',e))+'"></a-entity></a-entity>'+
          (e.imagen?'<a-entity aparicion-bruma="'+esc(attr('aparicion-bruma',e,{src:e.imagen}))+'"></a-entity>':'')}),
      // 4 · partículas escriben una palabra y se transforman en el modelo; acorde y coro mientras el trigger está a la vista
      palabra:(e,i,M)=>({anchor:'palabra-forma="'+esc(attr('palabra-forma',e,e.texto!=null?{text:e.texto}:{}))+'"',
        inner:marco(e,i)+'<a-gltf-model src="#'+M+'" '+tr(e,'0 -0.02 0.12','2.0 2.6 2.09')+'></a-gltf-model>'+
          (e.sonido===false?'':'<a-entity class="hz-chorus" choral-chord="'+esc(attr('choral-chord',e))+'"></a-entity><a-entity class="hz-choir" choir-voice="'+esc(attr('choir-voice',e))+'"></a-entity>')}),
      // 5 · los puntos forman el modelo, aparece el modelo y crece la hélice que se cierra en aureola
      genesis:(e,i,M)=>({anchor:'genesis="'+esc(attr('genesis',e))+'"',
        inner:marco(e,i)+'<a-gltf-model src="#'+M+'" '+tr(e,'0 0 0',0.85)+' '+(e.girar===false?'':giro)+'></a-gltf-model>'+
          (e.helice===false?'':'<a-entity position="0 0.03 0" dna-helix="'+esc(attr('dna-helix',e))+'"></a-entity>')}),
      // 6 · una pieza brilla y late; otra se construye con luz desde la base al vértice; red de nodos numerados arriba
      construccion:(e,i,M)=>{
        const g=attr('brillo-malla',e,{mesh:e.brillo||'Infinity_loop'}), a=attr('construye-aristas',e,{mesh:e.aristas||'PIRAMIDE ABAJO.002'}), ga=attr('brillo-malla__aristas',e,{mesh:e.aristas||'PIRAMIDE ABAJO.002'});
        return {anchor:'', inner:marco(e,i)+'<a-gltf-model src="#'+M+'" '+tr(e,'0 0 0',0.7)+' brillo-malla="'+esc(g)+'" construye-aristas="'+esc(a)+'" brillo-malla__aristas="'+esc(ga)+'" '+(e.girar===false?'':giro)+'></a-gltf-model>'+
          (e.red===false?'':'<a-entity class="hz-plexus" position="0 0.9 0" visible="false" plexus="'+esc(attr('plexus',e))+'"></a-entity>')}; }
    };

    ESC.forEach((e,i)=>{
      if(!e || (preview && i!==VER)) return;
      const f=EFECTOS[e.efecto]; if(!f){ console.warn('[Hz] efecto desconocido:',e.efecto); return; }
      const t=e.target!=null?e.target:i, M='hz-m'+i;
      if(e.modelo) assets+='<a-asset-item id="'+M+'" src="'+esc(e.modelo)+'"></a-asset-item>';
      const o=f(e,t,e.modelo?M:null);
      const ancla=preview?'hz-ancla':'mindar-image-target="targetIndex: '+t+'"';
      let card='';
      if(preview && HZ_DATOS.miniaturas[t]){ const asp=(HZ_DATOS.aspectos&&HZ_DATOS.aspectos[t])||1; card='<a-plane src="'+HZ_DATOS.miniaturas[t]+'" width="1" height="'+asp+'" position="0 0 -0.001" material="shader: flat; transparent: false"></a-plane>'; }
      else if(preview) card='<a-plane width="1" height="1" position="0 0 -0.001" material="shader: flat; color: #1a1a1a"></a-plane>';
      body+='<a-entity id="hz-ancla-'+i+'" class="hz-ancla" data-efecto="'+e.efecto+'" '+ancla+' '+o.anchor+'>'+card+o.inner+'</a-entity>';
    });

    const fondo=HZC((H.colores&&H.colores.fondo)||'#0B0906'), puntos=HZC((H.colores&&H.colores.puntos)||'#D9A441');
    const scene=
      '<a-scene '+(preview?'background="color: #101113"':'mindar-image="imageTargetSrc: '+esc(H.mind||'./mindar/targets.mind')+'; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 3; missTolerance: 10"')+
      ' color-space="sRGB" renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false"'+
      ' loading-screen="dotsColor: '+puntos+'; backgroundColor: '+fondo+'" device-orientation-permission-ui="enabled: false">'+
      '<a-assets>'+assets+'</a-assets>'+
      (preview?'<a-entity id="hz-cam" camera position="0 0 1.35" look-controls="enabled:false" wasd-controls="enabled:false"></a-entity><a-entity id="hz-giro" rotation="-15 0 0">'+body+'</a-entity>'
              :'<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>'+body)+
      '<a-entity id="pulse-holder"></a-entity></a-scene>';
    document.body.insertAdjacentHTML('afterbegin',scene);

    if(preview){
      // la vista previa: el trigger "aparece" apenas carga la escena
      const sc=document.querySelector('a-scene'), giroEl=document.getElementById('hz-giro'), cam=document.getElementById('hz-cam');
      sc.addEventListener('loaded',()=>setTimeout(()=>document.querySelectorAll('.hz-ancla').forEach(a=>a.emit('targetFound')),300));
      let drag=null, rx=-15, ry=0, z=1.35;
      window.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,rx,ry}; });
      window.addEventListener('pointerup',()=>drag=null);
      window.addEventListener('pointermove',e=>{ if(!drag) return; ry=drag.ry+(e.clientX-drag.x)*0.4; rx=Math.max(-89,Math.min(89,drag.rx+(e.clientY-drag.y)*0.4)); giroEl.setAttribute('rotation',rx+' '+ry+' 0'); });
      window.addEventListener('wheel',e=>{ z=Math.max(0.5,Math.min(6,z*(1+e.deltaY*0.001))); cam.setAttribute('position','0 0 '+z); },{passive:true});
    }
  })();
  </script>

  <!-- Eventos -->
  <script>
    // agua: la onda aparece con el trigger y arranca con una gota en el centro
    document.querySelectorAll('.hz-ancla[data-efecto="agua"]').forEach(a=>{
      const ripple=a.querySelector('.hz-ripple');
      a.addEventListener('targetFound',()=>{ ripple.setAttribute('visible',true); const r=ripple.components['ripple-surface']; r?.reset(); r?.addDrop(0.5,0.5); });
      a.addEventListener('targetLost', ()=> ripple.setAttribute('visible',false));
    });
    // construcción: la red de nodos solo mientras se ve el trigger
    document.querySelectorAll('.hz-ancla[data-efecto="construccion"]').forEach(a=>{
      const p=a.querySelector('.hz-plexus'); if(!p) return;
      a.addEventListener('targetFound',()=>p.setAttribute('visible',true));
      a.addEventListener('targetLost', ()=>p.setAttribute('visible',false));
    });
    // palabra: acorde + coro mientras el trigger está a la vista
    const voces=()=>[...document.querySelectorAll('.hz-chorus')].map(e=>e.components['choral-chord']).concat([...document.querySelectorAll('.hz-choir')].map(e=>e.components['choir-voice'])).filter(Boolean);
    document.querySelectorAll('.hz-ancla[data-efecto="palabra"]').forEach(a=>{
      const vs=()=>[a.querySelector('.hz-chorus')?.components['choral-chord'],a.querySelector('.hz-choir')?.components['choir-voice']].filter(Boolean);
      a.addEventListener('targetFound',async ()=>{ for(const v of vs()){ try{ await v._ensure(); v._arm(); v.gateOn(); }catch(e){} } });
      // CORTAR YA MISMO — cerrar contextos para evitar colas del delay
      a.addEventListener('targetLost',()=>vs().forEach(v=>v.stopNow()));
    });
    const armar=async ()=>{ for(const v of voces()){ try{ await v._ensure(); v._arm(); }catch(e){} } document.getElementById('audio-btn')?.classList.add('hidden'); };
    // Botón 🔊: desbloquea los motores de audio
    document.getElementById('audio-btn').addEventListener('click',armar,{passive:true});
    // Primer click global también arma y oculta el botón
    window.addEventListener('click',armar,{once:true,passive:true});
    if(!document.querySelector('.hz-chorus,.hz-choir')) document.getElementById('audio-btn').classList.add('hidden');
    // Failsafe: si la página va a 2º plano, cortar todo audio
    document.addEventListener('visibilitychange',()=>{ if(document.hidden) voces().forEach(v=>v.stopNow()); });

    window.addEventListener('orientationchange', ()=>location.reload(), {passive:true});
  </script>

</body>
